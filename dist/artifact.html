    <div class="card soft"><div class="ch"><h2>Resumen</h2></div>
      <div class="stat"><div class="lb">Total presupuestado</div><div class="v num">${money0(totalB)}</div><div class="s">${s.ingresos ? `${pct(totalB / s.ingresos * 100)} de tus ingresos del mes` : ''}</div></div>
      <div class="bar thick ${totalS > totalB ? 'b' : 'g'}"><i style="width:${totalB ? Math.min(100, totalS / totalB * 100) : 0}%"></i></div>

    </div>
  </section>`;
}

/* ---------- CALENDARIO ---------- */
function viewCalendario() {
  const ym = S.month; const ev = monthEvents(ym); const [y, m] = ym.split('-').map(Number); const today = todayISO();
  const first = new Date(y, m - 1, 1); const startDow = (first.getDay() + 6) % 7; const nd = daysIn(ym);
  const cells = []; for (let i = 0; i < startDow; i++) cells.push(null); for (let d = 1; d <= nd; d++) cells.push(d); while (cells.length % 7) cells.push(null);
  const byDay = {}; ev.forEach(e => { const d = Number(e.date.slice(8)); (byDay[d] = byDay[d] || []).push(e); });
  const evHtml = e => `<div class="ev${e.paid ? ' paid' : ''}" style="--c:${KIND_COLOR[e.kind]}" data-ev="${e.kind}:${e.id}" data-tip="<b>${esc(e.name)}</b>${e.amount != null ? money0(e.amount) + ' · ' : ''}${KIND_LABEL[e.kind]}${e.sub ? ' · ' + esc(e.sub) : ''}"><span>${esc(e.name)}</span>${e.amount != null ? `<b>${money0(e.amount)}</b>` : ''}</div>`;
  const total = sum(ev.filter(e => e.amount != null && e.kind !== 'corte'), e => e.amount);
  const pending = sum(ev.filter(e => e.amount != null && !e.paid && e.kind !== 'corte'), e => e.amount);
  return `
  <div class="ph"><div><div class="eyebrow">${monthLabel(ym)}</div><h1>Calendario de pagos</h1><p>${ev.filter(e => e.kind !== 'corte').length} pagos por <b class="num">${money0(total)}</b> · faltan <b class="num att">${money0(pending)}</b></p></div>
    <div class="leg2">${Object.entries(KIND_LABEL).map(([k, v]) => `<span><i class="sq" style="--c:${KIND_COLOR[k]}"></i>${v}</span>`).join('')}</div></div>
  <section class="card"><div class="cal">${['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'].map(d => `<div class="wd">${d}</div>`).join('')}
    ${cells.map(d => { if (!d) return '<div class="d out"></div>'; const iso = clampDay(ym, d); const list = byDay[d] || []; return `<div class="d${iso === today ? ' today' : ''}"><div class="n">${d}</div>${list.slice(0, 3).map(evHtml).join('')}${list.length > 3 ? `<div class="more">+${list.length - 3} más</div>` : ''}</div>`; }).join('')}</div>
    <div class="agenda">${ev.filter(e => e.kind !== 'corte').length ? ev.map(e => `<div class="row${e.date === today ? ' today' : ''}"><div class="dt"><b>${Number(e.date.slice(8))}</b><span>${MESES_C[m - 1]}</span></div><span class="ic" style="--cat:${KIND_COLOR[e.kind]};--cat-soft:color-mix(in srgb, ${KIND_COLOR[e.kind]} 14%, var(--surface))">${icon(e.kind === 'tarjeta' ? 'card' : e.kind === 'deuda' ? 'bank' : e.kind === 'meses' ? 'layers' : e.kind === 'corte' ? 'clock' : 'repeat')}</span><div class="tx"><b>${esc(e.name)}</b><span>${KIND_LABEL[e.kind]}${e.sub ? ' · ' + esc(e.sub) : ''}</span></div><div class="am ${e.paid ? 'pos' : e.kind === 'corte' ? 'mut' : 'att'}">${e.amount != null ? money0(e.amount) : '—'}${e.paid ? '<small>pagado</small>' : e.kind !== 'corte' ? '<small>pendiente</small>' : ''}</div></div>`).join('') : '<div class="empty"><h3>Sin pagos programados</h3><p>Agrega tarjetas, deudas o gastos recurrentes para verlos aquí.</p></div>'}</div></section>`;
}

  </section>`;

/* ---------- HISTORIAL ---------- */
function viewHistorial() {
  const months = monthsWithData(); const n = Math.min(12, Math.max(6, months.length));
  const H = historySeries(n, S.month >= thisMonth() ? S.month : thisMonth()); const labels = H.map(h => monthShort(h.ym));
  const catTotals = {}; H.forEach(h => Object.entries(h.byCat).forEach(([id, v]) => { catTotals[id] = (catTotals[id] || 0) + v; }));
  const topCats = Object.entries(catTotals).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([id]) => cat(id));
  const restIds = Object.keys(catTotals).filter(id => !topCats.some(c => c.id === id));
  const catSeries = topCats.map(c => ({ name: c.name, color: col(c.color), values: H.map(h => h.byCat[c.id] || 0) })); if (restIds.length) catSeries.push({ name: 'Otras', color: col(OTHERS_COLOR), values: H.map(h => restIds.reduce((a, id) => a + (h.byCat[id] || 0), 0)) });
  const A = S.histA || addMonths(S.month, -1), B = S.histB || S.month; const sa = monthSummary(A), sb = monthSummary(B);
  const cmp = [['Ingresos', 'ingresos', true], ['Gastos', 'gastosTotal', false], ['Gastos fijos', 'fijos', false], ['Gastos variables', 'variables', false], ['Pagos de tarjeta', 'pagosTarjeta', false], ['Pagos de deudas', 'pagosDeuda', false], ['Ahorro', 'ahorro', true], ['Disponible', 'queda', true], ['Deuda en tarjetas', 'tarjetasTotal', false], ['Otras deudas', 'deudasTotal', false]];
  const catsAB = [...new Set([...Object.keys(sa.byCat), ...Object.keys(sb.byCat)])].map(id => ({ c: cat(id), a: sa.byCat[id] || 0, b: sb.byCat[id] || 0 })).sort((x, y) => (y.b + y.a) - (x.b + x.a));
  const opts = sel => months.slice().reverse().map(m => `<option value="${m}"${m === sel ? ' selected' : ''}>${monthLabel(m)}</option>`).join('');
  return `
  <div class="ph"><div><div class="eyebrow">Últimos ${n} meses</div><h1>Historial</h1><p>Cómo han evolucionado tus ingresos, gastos, ahorro y deudas.</p></div><div class="chips">${months.slice().reverse().slice(0, 8).map(m => `<button class="chip${m === S.month ? ' on' : ''}" data-month="${m}">${monthShort(m)}</button>`).join('')}</div></div>
  <section class="g2">
    <div class="card"><div class="ch"><h2>Ingresos, gastos y ahorro</h2></div>${linesSVG(labels, [{ name: 'Ingresos', color: col('#6DB27C'), values: H.map(h => h.ingresos) }, { name: 'Gastos', color: col('#AE86CF'), values: H.map(h => h.gastosTotal) }, { name: 'Ahorro', color: col('#5DB3A4'), values: H.map(h => h.ahorro) }], { area: true })}</div>
    <div class="card"><div class="ch"><h2>Deuda total al cierre</h2></div>${barsSVG(labels, [{ name: 'Tarjetas', color: col('#AE86CF'), values: H.map(h => h.tarjetasTotal) }, { name: 'Otras deudas', color: col('#D0876F'), values: H.map(h => h.deudasTotal) }], { stacked: true })}</div>
  </section>
  <section class="card"><div class="ch"><h2>Gasto por categoría</h2></div>${barsSVG(labels, catSeries, { stacked: true, h: 260 })}</section>
  <section class="card"><div class="ch"><h2>Comparar dos meses</h2></div>
    <div class="hist-cmp"><select class="sel" id="cmp-a">${opts(A)}</select><span class="mut">vs</span><select class="sel" id="cmp-b">${opts(B)}</select></div>
    <div class="tscroll"><table class="tbl cmp-tbl"><thead><tr><th>Concepto</th><th class="n">${monthLabel(A)}</th><th class="n">${monthLabel(B)}</th><th class="n">Cambio</th></tr></thead><tbody>
      ${cmp.map(([lb, k, goodUp]) => { const a = sa[k], b = sb[k]; const d = a ? (b - a) / Math.abs(a) * 100 : null; const cls = d == null || Math.abs(d) < 1 ? '' : (d > 0) === goodUp ? 'down' : 'up'; return `<tr><td>${lb}</td><td class="n">${money0(a)}</td><td class="n"><b>${money0(b)}</b></td><td class="n"><span class="delta ${cls}">${d == null ? '—' : (d > 0 ? '+' : '') + Math.round(d) + '%'}</span></td></tr>`; }).join('')}
      <tr><td colspan="4" class="eyebrow" style="padding-top:16px">Por categoría</td></tr>
      ${catsAB.map(({ c, a, b }) => `<tr><td><span class="catdot" style="display:inline-flex;align-items:center;gap:8px"><i style="width:10px;height:10px;border-radius:3px;background:${col(c.color)}"></i>${esc(c.name)}</span></td><td class="n">${money0(a)}</td><td class="n"><b>${money0(b)}</b></td><td class="n">${deltaTag(a ? (b - a) / a * 100 : null)}</td></tr>`).join('')}
    </tbody></table></div></section>`;
}
function bindHistorial(root) {
  root.querySelector('#cmp-a').addEventListener('change', e => { S.histA = e.target.value; render(); });
  root.querySelector('#cmp-b').addEventListener('change', e => { S.histB = e.target.value; render(); });
  root.querySelectorAll('[data-month]').forEach(b => b.addEventListener('click', () => { S.month = b.dataset.month; S.histB = S.month; render(); }));
}

  <div class="ph"><div><div class="eyebrow">Configura</div><h1>Cuentas y ajustes</h1><p>Tus cuentas de débito y efectivo, respaldo de datos y datos de demostración.</p></div><div class="acts"><button class="btn primary" data-act="new-acc">${icon('plus')}<span>Agregar cuenta</span></button></div></div>

    <div class="card"><div class="ch"><h2>Cuentas</h2></div><div class="list">${S.data.accounts.length ? S.data.accounts.map(a => `<div class="row click" data-acc="${a.id}"><span class="ic" style="--cat:var(--green);--cat-soft:var(--green-soft)">${icon(a.type === 'efectivo' ? 'coins' : 'bank')}</span><div class="tx"><b>${esc(a.name)}</b><span>${a.type === 'efectivo' ? 'Efectivo' : 'Débito'}${a.institution ? ' · ' + esc(a.institution) : ''}</span></div><div class="am">${money0(accountBalance(a, ym))}<small>al cierre de ${monthShort(ym)}</small></div></div>`).join('') : '<div class="empty"><h3>Sin cuentas</h3><p>Agrega tu cuenta de débito o efectivo para saber cuánto tienes.</p></div>'}</div>
      <div class="f"><label for="goal">Meta de ahorro mensual</label><input class="inp" id="goal" type="number" min="0" step="100" value="${S.data.savingsGoal || ''}" placeholder="Ej. 3000"></div></div>
    <div class="card"><div class="ch"><h2>Datos</h2></div>
      ${S.data.demo ? `<p>Estás viendo <b>datos de demostración</b>. Cuando quieras empezar con tus finanzas reales, bórralos y comienza desde cero. Las categorías se conservan.</p><button class="btn danger" data-act="clear-demo" style="align-self:flex-start">${icon('trash')}Borrar datos de demostración</button>` : `<p>Tus datos se guardan en este navegador. Descarga un respaldo de vez en cuando.</p>`}
      <div class="chips"><button class="btn secondary sm" data-act="export">${icon('download')}Exportar respaldo</button><label class="btn secondary sm">${icon('upload')}Importar respaldo<input type="file" id="import" accept="application/json" hidden></label>${!S.data.demo ? `<button class="btn quiet sm" data-act="load-demo">Cargar datos demo</button>` : ''}<button class="btn danger sm" data-act="reset">Empezar de cero</button></div>
</div>
    ${typeof cloudCardHTML === 'function' ? cloudCardHTML() : ''}
  </section>`;
}
function bindAjustes(root) {
  if (typeof bindCloudCard === 'function') bindCloudCard(root);
  root.querySelector('#goal').addEventListener('change', e => { S.data.savingsGoal = Number(e.target.value) || 0; saveData(); toast('Meta guardada'); });
  root.querySelector('#import').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d.transactions || !d.categories) throw 0; d.version = 1; S.data = { ...emptyData(), ...d }; saveData(); render(); toast('Respaldo importado'); } catch (err) { toast('El archivo no es un respaldo válido'); } }; r.readAsText(f); });
}

const NAV_GROUPS = [['Mi mes', ['inicio', 'movimientos', 'gastos', 'resumen', 'historial']], ['Obligaciones', ['tarjetas', 'deudas', 'recurrentes', 'calendario']], ['Planear', ['presupuesto', 'categorias', 'ajustes']]];

<script>
/* ===== Raw Money · drawer y formularios ===== */
function closeDrawer() { document.querySelectorAll('.veil,.drawer,.sheet').forEach(e => e.remove()); document.removeEventListener('keydown', escClose); }
function escClose(e) { if (e.key === 'Escape') closeDrawer(); }
function openDrawer({ title, eyebrow, body, onSave, onDelete, saveLabel = 'Guardar', deleteLabel = 'Eliminar' }) {
  closeDrawer();
  const veil = document.createElement('div'); veil.className = 'veil'; veil.addEventListener('click', closeDrawer);
  const dr = document.createElement('aside'); dr.className = 'drawer'; dr.setAttribute('role', 'dialog'); dr.setAttribute('aria-label', title);
  dr.innerHTML = `<div class="dh"><div>${eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : ''}<h2>${title}</h2></div><button class="btn icon quiet" data-close aria-label="Cerrar">${icon('x')}</button></div><form class="body" novalidate>${body}</form><div class="df">${onDelete ? `<button class="btn danger" data-del>${icon('trash')}${deleteLabel}</button>` : ''}<span class="grow"></span><button class="btn quiet" data-close>Cancelar</button>${onSave ? `<button class="btn primary" data-save>${saveLabel}</button>` : ''}</div>`;
  document.body.append(veil, dr);
  dr.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeDrawer));
  const form = dr.querySelector('form');
  form.addEventListener('submit', e => { e.preventDefault(); if (onSave) onSave(readForm(form), form); });
  if (onSave) dr.querySelector('[data-save]').addEventListener('click', () => onSave(readForm(form), form));
  if (onDelete) dr.querySelector('[data-del]').addEventListener('click', onDelete);
  document.addEventListener('keydown', escClose);
  const first = form.querySelector('input:not([type=hidden]):not([type=radio]),select'); if (first && innerWidth > 900) first.focus();
  return dr;
}
function readForm(form) {
  const o = {};
  form.querySelectorAll('[name]').forEach(el => {
    if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; else if (!(el.name in o)) o[el.name] = o[el.name]; return; }
    if (el.type === 'checkbox') { o[el.name] = el.checked; return; }
    o[el.name] = el.type === 'number' ? (el.value === '' ? null : Number(el.value)) : el.value.trim();
  });
  return o;
}
const F = {
  text: (n, l, v = '', ph = '', extra = '') => `<div class="f"><label for="fx-${n}">${l}</label><input class="inp" id="fx-${n}" name="${n}" value="${esc(v)}" placeholder="${esc(ph)}" ${extra}></div>`,
  num: (n, l, v = '', ph = '', extra = '') => `<div class="f"><label for="fx-${n}">${l}</label><input class="inp" id="fx-${n}" name="${n}" type="number" inputmode="decimal" step="any" value="${v ?? ''}" placeholder="${esc(ph)}" ${extra}></div>`,
  amount: (n, v = '') => `<div class="f"><label for="fx-${n}">Monto (MXN)</label><input class="inp amount" id="fx-${n}" name="${n}" type="number" inputmode="decimal" step="any" min="0" value="${v ?? ''}" placeholder="0" required></div>`,
  date: (n, l, v) => `<div class="f"><label for="fx-${n}">${l}</label><input class="inp" id="fx-${n}" name="${n}" type="date" value="${v || todayISO()}"></div>`,
  month: (n, l, v) => `<div class="f"><label for="fx-${n}">${l}</label><input class="inp" id="fx-${n}" name="${n}" type="month" value="${v || thisMonth()}"></div>`,
  sel: (n, l, opts, v, hint = '') => `<div class="f" data-f="${n}"><label for="fx-${n}">${l}</label><select class="sel" id="fx-${n}" name="${n}">${opts.map(([k, t]) => `<option value="${k}"${String(k) === String(v) ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>${hint ? `<div class="hint">${hint}</div>` : ''}</div>`,
  seg: (n, opts, v) => `<div class="seg" data-f="${n}">${opts.map(([k, t]) => `<label><input type="radio" name="${n}" value="${k}"${k === v ? ' checked' : ''}>${t}</label>`).join('')}</div>`,
  toggle: (n, l, v) => `<label class="toggle"><input type="checkbox" name="${n}"${v ? ' checked' : ''}>${l}</label>`,
  area: (n, l, v = '') => `<div class="f"><label for="fx-${n}">${l}</label><textarea class="inp" id="fx-${n}" name="${n}" rows="2">${esc(v)}</textarea></div>`,
  colors: (n, v) => `<div class="f"><label>Color</label><div class="swatches">${CAT_COLORS.map(c => `<label style="--c:${c}"><input type="radio" name="${n}" value="${c}"${c === v ? ' checked' : ''}></label>`).join('')}</div></div>`,
  icons: (n, v) => `<div class="f"><label>Ícono</label><div class="icons">${CAT_ICON_KEYS.map(k => `<label><input type="radio" name="${n}" value="${k}"${k === v ? ' checked' : ''}>${icon(k)}</label>`).join('')}</div></div>`,
};
const catOpts = kind => S.data.categories.filter(c => c.kind === kind).map(c => [c.id, c.name]);
const accOpts = () => S.data.accounts.map(a => [a.id, a.name]);
const cardOpts = () => S.data.cards.map(c => [c.id, c.name]);
const allAccOpts = () => [...S.data.accounts.map(a => [a.id, a.name]), ...S.data.cards.map(c => [c.id, `${c.name} (crédito)`])];
function need(form, ok, msg) { if (!ok) { toast(msg); return false; } return true; }

/* ---------- Movimiento ---------- */
function formTx(t, preset = {}) {
  const isNew = !t; const v = { type: 'gasto', date: todayISO(), method: 'debito', accountId: (S.data.accounts[0] || {}).id, categoryId: 'alimentacion', fixed: false, ...preset, ...(t || {}) };
  const body = `
    ${F.seg('type', Object.entries(TYPES), v.type)}
    ${F.amount('amount', v.amount)}
    <div class="fr">${F.date('date', 'Fecha', v.date)}${F.text('desc', 'Descripción', v.desc, 'Ej. Súper, Gasolina…', 'required')}</div>
    ${F.sel('categoryId', 'Categoría', catOpts(v.type === 'ingreso' ? 'ingreso' : 'gasto'), v.categoryId)}
    ${F.sel('method', 'Método de pago', Object.entries(METHODS), v.method)}
    ${F.sel('accountId', 'Cuenta o tarjeta', allAccOpts(), v.accountId, 'Si usas tarjeta de crédito, elige la tarjeta y el método “Crédito”.')}
    ${F.sel('targetId', 'Destino', [], v.targetId)}
    ${F.toggle('fixed', 'Es un gasto fijo (renta, servicios, mensualidades…)', v.fixed)}
    ${F.area('notes', 'Notas (opcional)', v.notes)}`;
  const dr = openDrawer({ title: isNew ? 'Nuevo movimiento' : 'Editar movimiento', eyebrow: isNew ? 'Registrar' : dateLong(v.date), body, saveLabel: isNew ? 'Registrar' : 'Guardar cambios',
    onSave: (o, form) => {
      if (!need(form, o.amount > 0, 'Escribe un monto mayor a cero')) return; if (!need(form, o.desc, 'Escribe una descripción')) return;
      const isCard = !!byId(S.data.cards, o.accountId);
      if (o.type === 'gasto' && isCard) o.method = 'credito';
      if (o.type === 'gasto' && o.method === 'credito' && !isCard) { if (!need(form, false, 'Para pagar con crédito elige una tarjeta')) return; }
      if (o.type !== 'gasto' && isCard) { if (!need(form, false, 'Elige una cuenta de débito o efectivo')) return; }
      if (['transferencia', 'pago_tarjeta', 'pago_deuda'].includes(o.type) && !o.targetId) { if (!need(form, false, 'Elige el destino')) return; }
      if (!['gasto', 'ingreso'].includes(o.type)) o.categoryId = null;
      if (o.type !== 'gasto') o.fixed = false;
      if (!['transferencia', 'pago_tarjeta', 'pago_deuda'].includes(o.type)) o.targetId = null;
      if (o.type === 'ingreso' && o.method === 'credito') o.method = 'transferencia';
      if (isNew) { S.data.transactions.push({ id: uid(), ...o }); toast(o.type === 'ingreso' ? 'Ingreso registrado' : 'Movimiento registrado'); }
      else { Object.assign(t, o); toast('Cambios guardados'); }
      saveData(); closeDrawer(); render();
    },
    onDelete: isNew ? null : () => confirmBox('¿Eliminar este movimiento?', t.recurringId ? 'Es un gasto recurrente: solo se quitará de este mes.' : 'Esta acción no se puede deshacer.', () => { if (t.recurringId) S.data.skips.push(t.id); S.data.transactions = S.data.transactions.filter(x => x.id !== t.id); saveData(); closeDrawer(); render(); toast('Movimiento eliminado'); }) });
  const form = dr.querySelector('form');
  const sync = () => {
    const type = form.querySelector('[name=type]:checked').value; const method = form.querySelector('[name=method]');
    const show = (n, on) => { const el = form.querySelector(`[data-f="${n}"]`); if (el) el.hidden = !on; };
    show('categoryId', type === 'gasto' || type === 'ingreso'); show('method', type === 'gasto');
    show('targetId', ['transferencia', 'pago_tarjeta', 'pago_deuda'].includes(type));
    form.querySelector('.toggle').hidden = type !== 'gasto';
    form.querySelector('label[for=fx-accountId]').textContent = type === 'transferencia' ? 'Desde la cuenta' : type === 'gasto' ? 'Cuenta o tarjeta' : type === 'ingreso' ? 'Cuenta donde entra' : 'Cuenta desde la que pagas';
    // categorías por tipo
    const cs = form.querySelector('[name=categoryId]'); const kind = type === 'ingreso' ? 'ingreso' : 'gasto';
    if (cs.dataset.kind !== kind) { const cur = cs.value; cs.innerHTML = catOpts(kind).map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join(''); cs.dataset.kind = kind; if ([...cs.options].some(o => o.value === cur)) cs.value = cur; else if (kind === 'ingreso') cs.value = 'sueldo'; }
    // cuentas: sólo débito/efectivo salvo gasto
    const as = form.querySelector('[name=accountId]'); const cur = as.value; const opts = type === 'gasto' ? allAccOpts() : accOpts();
    as.innerHTML = opts.map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join(''); if (opts.some(o => o[0] === cur)) as.value = cur;
    // destino
    const ts = form.querySelector('[name=targetId]'); const tcur = ts.value;
    const topts = type === 'transferencia' ? accOpts().filter(o => o[0] !== as.value) : type === 'pago_tarjeta' ? cardOpts() : type === 'pago_deuda' ? S.data.debts.map(d => [d.id, d.name]) : [];
    ts.innerHTML = topts.map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join(''); if (topts.some(o => o[0] === tcur)) ts.value = tcur;
    form.querySelector('label[for=fx-targetId]').textContent = type === 'transferencia' ? 'A la cuenta' : type === 'pago_tarjeta' ? 'Tarjeta que pagas' : 'Deuda que pagas';
    if (type === 'gasto') { const isCard = !!byId(S.data.cards, as.value); if (isCard) method.value = 'credito'; else if (method.value === 'credito') method.value = 'debito'; }
  };
  form.addEventListener('change', e => { if (['type', 'accountId', 'method'].includes(e.target.name)) { if (e.target.name === 'method' && e.target.value === 'credito' && !byId(S.data.cards, form.querySelector('[name=accountId]').value) && S.data.cards[0]) form.querySelector('[name=accountId]').value = S.data.cards[0].id; sync(); } });
  sync();
}

/* ---------- Tarjeta ---------- */
function formCard(c) {
  const isNew = !c; const v = { cutDay: 15, payDay: 5, minPct: 5, color: '#8A3B75', opening: 0, ...(c || {}) };
  const body = `<div class="fr">${F.text('name', 'Nombre', v.name, 'Ej. BBVA Azul', 'required')}${F.text('institution', 'Institución', v.institution, 'Ej. BBVA')}</div>
    <div class="fr">${F.num('limit', 'Límite de crédito', v.limit, '20000', 'required')}${F.num('opening', isNew ? 'Saldo actual (lo que debes hoy)' : 'Saldo inicial registrado', v.opening, '0')}</div>
    <div class="fr">${F.num('cutDay', 'Día de corte', v.cutDay, '15', 'min="1" max="31"')}${F.num('payDay', 'Día límite de pago', v.payDay, '5', 'min="1" max="31"')}</div>
    <div class="fr">${F.num('minPct', 'Pago mínimo (% del saldo)', v.minPct, '5')}${F.num('noInterest', 'Pago para no generar intereses', v.noInterest, 'Automático', '')}</div>
    ${F.num('rate', 'Tasa de interés anual (%) · opcional', v.rate, '42.9')}
    ${F.colors('color', v.color)}
    <div class="hint">El saldo se actualiza solo con cada compra a crédito, mensualidad y pago que registres. “Pago para no generar intereses” se calcula con el saldo del cierre anterior si lo dejas vacío.</div>`;
  openDrawer({ title: isNew ? 'Agregar tarjeta' : 'Editar tarjeta', eyebrow: 'Tarjeta de crédito', body, saveLabel: isNew ? 'Agregar' : 'Guardar',
    onSave: (o, f) => { if (!need(f, o.name, 'Escribe el nombre')) return; if (!need(f, o.limit > 0, 'Escribe el límite')) return; o.opening = o.opening || 0; if (isNew) S.data.cards.push({ id: uid(), ...o }); else Object.assign(c, o); saveData(); closeDrawer(); render(); toast(isNew ? 'Tarjeta agregada' : 'Tarjeta guardada'); },
    onDelete: isNew ? null : () => confirmBox(`¿Eliminar ${c.name}?`, 'Se eliminarán también sus compras a meses. Los movimientos se conservan.', () => { S.data.cards = S.data.cards.filter(x => x.id !== c.id); S.data.installments = S.data.installments.filter(i => i.cardId !== c.id); saveData(); closeDrawer(); render(); toast('Tarjeta eliminada'); }) });
}
function detailCard(c) {
  const m = cardMonth(c, S.month); const ym = S.month;
  const inst = S.data.installments.filter(i => i.cardId === c.id && installmentInfo(i, ym).active);
  const txs = S.data.transactions.filter(t => inMonth(t, ym) && ((t.type === 'gasto' && t.accountId === c.id) || (t.type === 'pago_tarjeta' && t.targetId === c.id))).sort((a, b) => b.date.localeCompare(a.date));
  const body = `<dl class="detail"><dt>Saldo actual</dt><dd class="num"><b>${money0(m.bal)}</b></dd><dt>Límite</dt><dd class="num">${money0(c.limit)}</dd><dt>Disponible</dt><dd class="num pos">${money0(m.available)}</dd><dt>Utilización</dt><dd class="num">${pct(m.util)}</dd><dt>Corte</dt><dd>día ${c.cutDay}</dd><dt>Límite de pago</dt><dd>${dateLong(m.payDate)} ${statusTag(m.status)}</dd><dt>Pago mínimo</dt><dd class="num">${money0(m.minPay)}</dd><dt>Sin intereses</dt><dd class="num">${money0(m.noInterest)}</dd><dt>Pagado este mes</dt><dd class="num">${money0(m.paid)}</dd><dt>Compras del mes</dt><dd class="num">${money0(m.purchases)}</dd>${inst.length ? `<dt>Mensualidades</dt><dd class="num">${money0(m.instMonthly)} (${inst.map(i => esc(i.desc)).join(', ')})</dd>` : ''}</dl>
    <div class="chips"><button type="button" class="btn primary sm" data-pay>${icon('check')}Registrar pago</button><button type="button" class="btn secondary sm" data-buy>${icon('plus')}Compra con esta tarjeta</button><button type="button" class="btn secondary sm" data-edit>${icon('edit')}Editar</button></div>
    <div><div class="eyebrow" style="margin-bottom:6px">Movimientos de ${monthLabel(ym)}</div><div class="list">${txs.length ? txs.map(t => txRow(t)).join('') : '<p class="mut">Sin movimientos este mes.</p>'}</div></div>`;
  const dr = openDrawer({ title: c.name, eyebrow: c.institution || 'Tarjeta de crédito', body });
  dr.querySelector('[data-pay]').addEventListener('click', () => formTx(null, { type: 'pago_tarjeta', targetId: c.id, amount: Math.max(0, Math.min(m.noInterest, m.prev) - m.paid) || m.bal, desc: `Pago ${c.name}`, method: 'transferencia' }));
  dr.querySelector('[data-buy]').addEventListener('click', () => formTx(null, { type: 'gasto', accountId: c.id, method: 'credito' }));
  dr.querySelector('[data-edit]').addEventListener('click', () => formCard(c));
  dr.querySelectorAll('[data-tx]').forEach(r => r.addEventListener('click', () => formTx(byId(S.data.transactions, r.dataset.tx))));
}

/* ---------- Compra a meses ---------- */
function formInstallment(i) {
  const isNew = !i; const v = { months: 12, start: thisMonth(), cardId: (S.data.cards[0] || {}).id, categoryId: 'compras', ...(i || {}) };
  const body = `${F.text('desc', 'Descripción', v.desc, 'Ej. Laptop', 'required')}
    <div class="fr">${F.num('total', 'Monto total', v.total, '18000', 'required')}${F.num('months', 'Número de meses', v.months, '12', 'min="1" required')}</div>
    <div class="fr">${F.month('start', 'Mes de inicio', v.start)}${F.sel('cardId', 'Tarjeta', cardOpts(), v.cardId)}</div>
    ${F.sel('categoryId', 'Categoría', catOpts('gasto'), v.categoryId)}
    <div class="hint" id="ins-calc"></div>`;
  const dr = openDrawer({ title: isNew ? 'Compra a meses' : 'Editar compra a meses', eyebrow: 'Pago diferido', body, saveLabel: isNew ? 'Registrar' : 'Guardar',
    onSave: (o, f) => { if (!need(f, o.desc && o.total > 0 && o.months > 0, 'Completa descripción, monto y meses')) return; if (!need(f, o.cardId, 'Agrega una tarjeta primero')) return; if (isNew) S.data.installments.push({ id: uid(), ...o }); else Object.assign(i, o); saveData(); closeDrawer(); render(); toast('Compra a meses guardada'); },
    onDelete: isNew ? null : () => confirmBox(`¿Eliminar ${i.desc}?`, 'Dejará de sumarse a la tarjeta y al presupuesto.', () => { S.data.installments = S.data.installments.filter(x => x.id !== i.id); saveData(); closeDrawer(); render(); toast('Eliminada'); }) });
  const f = dr.querySelector('form'); const calc = () => { const o = readForm(f); const el = f.querySelector('#ins-calc'); if (o.total > 0 && o.months > 0) { const end = addMonths(o.start || thisMonth(), o.months - 1); el.innerHTML = `Mensualidad de <b>${money(o.total / o.months)}</b> · termina en <b>${monthLabel(end)}</b>. No la registres además como gasto: la mensualidad se suma sola cada mes a la tarjeta y a tus gastos fijos.`; } else el.textContent = ''; };
  f.addEventListener('input', calc); calc();
}

/* ---------- Deuda ---------- */
function formDebt(d) {
  const isNew = !d; const v = { payDay: 15, start: thisMonth(), ...(d || {}) };
  const body = `<div class="fr">${F.text('name', 'Nombre de la deuda', v.name, 'Ej. Crédito del auto', 'required')}${F.text('creditor', 'Acreedor', v.creditor, 'Ej. Banco, familiar…')}</div>

<script>
/* ===== Raw Money · sincronización con Supabase (opcional) =====
   Una fila por usuario en la tabla finanzas_state (user_id, data jsonb, updated_at).
   localStorage sigue siendo la copia de trabajo; la nube es respaldo + sincronización. */
const CLOUD = { client: null, user: null, ready: false, saving: false, lastError: '', enabled: false };
function cloudEnabled() { return !!(window.SUPABASE && window.SUPABASE.url && window.SUPABASE.anonKey && window.supabase); }

async function initCloud() {
  CLOUD.enabled = cloudEnabled();
  if (!CLOUD.enabled) return;
  CLOUD.client = window.supabase.createClient(window.SUPABASE.url, window.SUPABASE.anonKey);
  const { data: { session } } = await CLOUD.client.auth.getSession();
  CLOUD.user = session ? session.user : null;
  CLOUD.client.auth.onAuthStateChange(async (event, sess) => {
    if (event === 'PASSWORD_RECOVERY') { CLOUD.user = sess ? sess.user : CLOUD.user; formNewPassword(); return; }
    const was = CLOUD.user && CLOUD.user.id; CLOUD.user = sess ? sess.user : null;
    if (CLOUD.user && CLOUD.user.id !== was) { await cloudPull(); S.locked = false; render(); }
    if (!CLOUD.user && was) { S.locked = true; render(); }
  });
  if (CLOUD.user) { await cloudPull(); }
  CLOUD.ready = true;
}

/* Trae la fila del usuario. Si no existe y hay datos locales, los sube. */
async function cloudPull() {
  if (!CLOUD.client || !CLOUD.user) return;
  const { data, error } = await CLOUD.client.from('finanzas_state').select('data, updated_at').eq('user_id', CLOUD.user.id).maybeSingle();
  if (error) { CLOUD.lastError = error.message; return; }
  if (data && data.data && data.data.version === 1) {
    const remoteTx = (data.data.transactions || []).length; const localTx = (S.data.transactions || []).length;
    const localIsDemo = S.data.demo;
    // La nube manda, salvo que la nube esté vacía y aquí haya datos reales.
    if (remoteTx > 0 || localTx === 0 || localIsDemo) { S.data = { ...emptyData(), ...data.data }; try { localStorage.setItem(DB_KEY, JSON.stringify(S.data)); } catch (e) {} }
    else await cloudPush();
  } else if (!S.data.demo && (S.data.transactions.length || S.data.cards.length || S.data.accounts.length)) {
    await cloudPush();
  }
}

let cloudT;
function cloudSave() { if (!CLOUD.client || !CLOUD.user) return; clearTimeout(cloudT); cloudT = setTimeout(cloudPush, 900); }
async function cloudPush() {
  if (!CLOUD.client || !CLOUD.user) return;
  CLOUD.saving = true; setCloudDot();
  const { error } = await CLOUD.client.from('finanzas_state').upsert({ user_id: CLOUD.user.id, data: S.data, updated_at: new Date().toISOString() });
  CLOUD.saving = false; CLOUD.lastError = error ? error.message : ''; setCloudDot();
  if (error) toast('No se pudo guardar en la nube');
}
function setCloudDot() { const el = document.querySelector('.cloud-dot'); if (!el) return; el.className = 'cloud-dot ' + (CLOUD.lastError ? 'err' : CLOUD.saving ? 'busy' : CLOUD.user ? 'on' : ''); el.title = CLOUD.lastError || (CLOUD.saving ? 'Guardando…' : CLOUD.user ? 'Sincronizado' : 'Sin sesión'); }

async function cloudSignIn(email) {
  if (!CLOUD.client) return;
  const { error } = await CLOUD.client.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
  if (error) toast(error.message); else toast('Te enviamos un enlace a tu correo');
}
async function cloudSignInPassword(email, password) {
  if (!CLOUD.client) return;
  if (!email || !password) { toast('Escribe correo y contraseña'); return; }
  const { error } = await CLOUD.client.auth.signInWithPassword({ email, password });
  if (error) toast(/invalid/i.test(error.message) ? 'Correo o contraseña incorrectos' : error.message);
}
async function cloudSignUp(email, password) {
  if (!CLOUD.client) return;
  if (!email || password.length < 8) { toast('La contraseña debe tener al menos 8 caracteres'); return; }
  const { data, error } = await CLOUD.client.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });
  if (error) { toast(error.message); return; }
  if (data.session) toast('Cuenta creada'); else toast('Cuenta creada: confirma tu correo con el enlace que te enviamos');
}
async function cloudReset(email) {
  if (!CLOUD.client) return;
  if (!email) { toast('Escribe tu correo'); return; }
  const { error } = await CLOUD.client.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  if (error) toast(error.message); else toast('Te enviamos un enlace para cambiar la contraseña');
}
function formNewPassword() {
  const dr = openDrawer({ title: 'Nueva contraseña', eyebrow: 'Recuperar acceso', body: `${F.text('pw1', 'Nueva contraseña (mínimo 8 caracteres)', '', '', 'type="password" autocomplete="new-password" required')}${F.text('pw2', 'Repite la contraseña', '', '', 'type="password" autocomplete="new-password" required')}`, saveLabel: 'Guardar contraseña',
    onSave: async (o, f) => { if (o.pw1.length < 8) { toast('Mínimo 8 caracteres'); return; } if (o.pw1 !== o.pw2) { toast('Las contraseñas no coinciden'); return; } const { error } = await CLOUD.client.auth.updateUser({ password: o.pw1 }); if (error) { toast(error.message); return; } closeDrawer(); render(); toast('Contraseña actualizada'); } });
  return dr;
}
async function cloudSignOut() { if (!CLOUD.client) return; await CLOUD.client.auth.signOut(); CLOUD.user = null; S.locked = true; render(); }

/* Tarjeta "Nube" para Cuentas y ajustes */
function cloudCardHTML() {
  if (!CLOUD.enabled) return `<div class="card"><div class="ch"><h2>Sesión</h2></div><div class="chips"><button class="btn secondary sm" id="local-pw">Cambiar contraseña</button><button class="btn quiet sm" data-act="lock">Cerrar sesión</button></div></div>`;
  if (CLOUD.user) return `<div class="card"><div class="ch"><h2>Nube</h2><span class="tag good">${esc(CLOUD.user.email)}</span></div>${CLOUD.lastError ? `<p class="neg" style="font-size:13px">${esc(CLOUD.lastError)}</p>` : ''}<div class="chips"><button class="btn secondary sm" id="cloud-pull">Traer de la nube</button><button class="btn secondary sm" id="cloud-push">Subir ahora</button><button class="btn secondary sm" id="cloud-pw">Cambiar contraseña</button><button class="btn quiet sm" id="cloud-out">Cerrar sesión</button></div></div>`;
  return '';
}
function bindCloudCard(root) {
  const lp = root.querySelector('#local-pw'); if (lp) lp.addEventListener('click', formLocalPassword);
  const o = root.querySelector('#cloud-out'); if (o) o.addEventListener('click', cloudSignOut);
  const pwb = root.querySelector('#cloud-pw'); if (pwb) pwb.addEventListener('click', formNewPassword);
  const pl = root.querySelector('#cloud-pull'); if (pl) pl.addEventListener('click', async () => { await cloudPull(); render(); toast('Datos traídos de la nube'); });
  const ps = root.querySelector('#cloud-push'); if (ps) ps.addEventListener('click', async () => { await cloudPush(); toast('Subido'); });
}

<script>
/* ===== Raw Money · portada estilo SAMSARA: flores en ASCII sobre frutas desenfocadas + candado ===== */
const LOCK_KEY = 'midinero.lock'; const UNLOCK_KEY = 'midinero.unlocked';
function hash(i, j, s = 0) { let h = (i * 374761393 + j * 668265263 + s * 1274126177) | 0; h = (h ^ (h >>> 13)) * 1274126177; h = h ^ (h >>> 16); return ((h >>> 0) % 1000) / 1000; }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* Pétalo de bezier con gradiente (adaptado del arte de Samsara) */
function petal(g, angle, len, wid, c0, c1, curve = 0.5) {
  g.save(); g.rotate(angle);
  const grad = g.createLinearGradient(0, 0, len, 0); grad.addColorStop(0, c0); grad.addColorStop(.55, c1); grad.addColorStop(1, 'rgba(255,255,255,.6)');
  g.fillStyle = grad; g.beginPath(); g.moveTo(0, 0); g.bezierCurveTo(len * .25, -wid * curve, len * .85, -wid, len, 0); g.bezierCurveTo(len * .85, wid, len * .25, wid * curve, 0, 0); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(26,18,32,.35)'; g.lineWidth = 1; g.stroke();
  g.strokeStyle = 'rgba(26,18,32,.18)'; g.lineWidth = .8;
  for (let k = -2; k <= 2; k++) { g.beginPath(); g.moveTo(len * .1, 0); g.quadraticCurveTo(len * .5, k * wid * .28, len * .92, k * wid * .18); g.stroke(); }
  g.restore();
}
/* Orquídea phalaenopsis (adaptada de Samsara) */
function orchidAt(g, cx, cy, s, rot, pal, seed = 1) {
  g.save(); g.translate(cx, cy); g.rotate(rot); const A = Math.PI / 180; const [pink, light, rose, mag] = pal;
  petal(g, (90 + 38) * A, s * .78, s * .24, rose, pink); petal(g, (90 - 38) * A, s * .78, s * .24, rose, pink);
  petal(g, -90 * A, s * .8, s * .22, rose, pink);
  petal(g, (-90 + 62) * A, s * .92, s * .42, pink, light, .35); petal(g, (-90 - 62) * A, s * .92, s * .42, pink, light, .35);
  petal(g, 90 * A, s * .42, s * .16, mag, rose, .6); petal(g, (90 + 22) * A, s * .32, s * .12, mag, rose, .7); petal(g, (90 - 22) * A, s * .32, s * .12, mag, rose, .7);
  g.fillStyle = '#f1e9df'; g.beginPath(); g.ellipse(0, -s * .02, s * .09, s * .12, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = mag; for (let k = 0; k < 26; k++) { const a = hash(k, seed, 2) * Math.PI * 2, rr = s * (.06 + hash(k, seed, 3) * .22); g.globalAlpha = .5 + hash(k, seed, 5) * .5; g.beginPath(); g.arc(Math.cos(a) * rr, Math.sin(a) * rr * .8 + s * .06, 1.2 + hash(k, seed, 6) * 2.4, 0, Math.PI * 2); g.fill(); }

function lilyPetal(g, angle, len, wid, c0, c1) {
  g.save(); g.rotate(angle);
  const grad = g.createLinearGradient(0, 0, len, 0); grad.addColorStop(0, c1); grad.addColorStop(.5, c0); grad.addColorStop(1, c1);
  g.fillStyle = grad; g.beginPath(); g.moveTo(0, 0); g.bezierCurveTo(len * .3, -wid, len * .8, -wid * .55, len, 0); g.bezierCurveTo(len * .8, wid * .55, len * .3, wid, 0, 0); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(26,18,32,.3)'; g.lineWidth = 1; g.stroke();
  g.strokeStyle = 'rgba(26,18,32,.22)'; g.lineWidth = 1; g.beginPath(); g.moveTo(len * .05, 0); g.lineTo(len * .95, 0); g.stroke();
  g.restore();
}
function lilyAt(g, cx, cy, s, rot, pal, seed = 1) {
  g.save(); g.translate(cx, cy); g.rotate(rot); const [c0, c1, dark] = pal;
  for (let k = 0; k < 3; k++) lilyPetal(g, k / 3 * Math.PI * 2 + Math.PI / 6, s * .95, s * .2, c0, c1);
  for (let k = 0; k < 3; k++) lilyPetal(g, k / 3 * Math.PI * 2, s * 1.05, s * .26, c0, c1);
  g.fillStyle = dark; for (let k = 0; k < 40; k++) { const a = hash(k, seed, 9) * Math.PI * 2, rr = s * (.08 + hash(k, seed, 10) * .35); g.globalAlpha = .6; g.beginPath(); g.arc(Math.cos(a) * rr * .6, Math.sin(a) * rr, 1.2, 0, Math.PI * 2); g.fill(); }
  g.globalAlpha = 1; g.strokeStyle = '#f1e9df'; g.lineWidth = 1.4;
  for (let k = 0; k < 6; k++) { const a = -Math.PI / 2 + (k - 2.5) * .28; const L = s * .55; g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(Math.cos(a) * L * .5, Math.sin(a) * L * .5 - s * .1, Math.cos(a) * L, Math.sin(a) * L); g.stroke(); g.fillStyle = dark; g.beginPath(); g.ellipse(Math.cos(a) * L, Math.sin(a) * L, s * .05, s * .025, a, 0, Math.PI * 2); g.fill(); }
  g.restore();
}
/* Peonía: capas concéntricas de pétalos redondeados, más claros hacia afuera */
function peonyAt(g, cx, cy, s, rot, pal, seed = 1) {
  g.save(); g.translate(cx, cy); g.rotate(rot); const [deep, mid, light] = pal;
  const rings = [[14, 1, .34, deep, mid], [11, .78, .34, mid, light], [8, .56, .36, mid, light], [6, .36, .4, deep, mid]];
  rings.forEach(([n, len, wid, a, b], ri) => { for (let k = 0; k < n; k++) { const ang = k / n * Math.PI * 2 + ri * .4 + (hash(k, seed, ri) - .5) * .3; petal(g, ang, s * len * (.9 + hash(k, seed, ri + 5) * .2), s * wid, a, b, .95); } });

function drawFlowers(W, H, seed = 3) {
  const c = mkCanvas(W, H), g = c.getContext('2d'); const m = Math.min(W, H);

  orchidAt(g, W * .74, H * .28, m * .19, .5, ['#9fb4ea', '#dbe3fa', '#5a6fb5', '#2f3f7a'], seed + 1);
  lilyAt(g, W * .7, H * .72, m * .2, .9, ['#e6a6b6', '#f6dde4', '#8f1d43'], seed + 2);
  orchidAt(g, W * .17, H * .8, m * .12, -1.1, ['#e6a6b6', '#f6d3dc', '#c9506f', '#8f1d43'], seed + 3);
  return c;
}
/* Capa de frutas exóticas (mango, pitaya, papaya, higo) muy desenfocadas */
function drawFruits(W, H, seed = 5) {
  const c = mkCanvas(W, H), g = c.getContext('2d');
  const fr = [['#e7a24c', '#b44e2a'], ['#e86a8f', '#a83060'], ['#f1c25a', '#c97a2b'], ['#9d78c4', '#5a3d6e'], ['#f0b86a', '#c8612f'], ['#c9506f', '#8f1d43']];
  for (let k = 0; k < 14; k++) { const [c1, c2] = fr[k % fr.length]; const x = hash(k, seed, 1) * W, y = H * .35 + hash(k, seed, 2) * H * .7, r = Math.min(W, H) * (.09 + hash(k, seed, 3) * .14); const gr = g.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r); gr.addColorStop(0, c1); gr.addColorStop(1, c2); g.fillStyle = gr; g.globalAlpha = .9; g.beginPath(); g.ellipse(x, y, r * (1 + hash(k, seed, 4) * .3), r, hash(k, seed, 5) * 3, 0, Math.PI * 2); g.fill(); }
  g.globalAlpha = 1; return c;
}
const RAMP = ' .·:;-~=+*#%@';
function asciiFy(src, cell = 7, boost = 1.2) {
  const w = src.width, h = src.height, out = mkCanvas(w, h), g = out.getContext('2d'); const data = src.getContext('2d').getImageData(0, 0, w, h).data;
  g.font = `600 ${cell + 3}px "IBM Plex Mono", ui-monospace, Menlo, monospace`; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let y = 0; y < h; y += cell) for (let x = 0; x < w; x += cell) {
    let r = 0, gg = 0, b = 0, a = 0, n = 0;
    for (let yy = y; yy < Math.min(h, y + cell); yy += 2) for (let xx = x; xx < Math.min(w, x + cell); xx += 2) { const i = (yy * w + xx) * 4; r += data[i]; gg += data[i + 1]; b += data[i + 2]; a += data[i + 3]; n++; }
    r /= n; gg /= n; b /= n; a /= n * 255; if (a < .12) continue;
    const lum = (.3 * r + .59 * gg + .11 * b) / 255 * a; const idx = Math.min(RAMP.length - 1, Math.round(lum * (RAMP.length - 1))); if (idx === 0) continue;
    g.fillStyle = `rgba(${Math.min(255, r * boost)},${Math.min(255, gg * boost)},${Math.min(255, b * boost)},${Math.min(1, a + .15)})`;
    g.fillText(RAMP[idx], x + cell / 2, y + cell / 2);
  }
  return out;
}
function glitch(src, seed = 1, amount = 1) {
  const w = src.width, h = src.height, out = mkCanvas(w, h), g = out.getContext('2d'); g.drawImage(src, 0, 0);
  const bands = 5 + Math.floor(hash(seed, 7) * 4);
  for (let k = 0; k < bands; k++) { const y = Math.floor(hash(k, seed, 11) * h * .9), bh = 4 + Math.floor(hash(k, seed, 12) * h * .06); const dx = (hash(k, seed, 13) - .5) * w * .12 * amount, sx = 1 + (hash(k, seed, 14) - .5) * .25 * amount; g.clearRect(0, y, w, bh); g.drawImage(src, 0, y, w, bh, dx + (w - w * sx) / 2, y, w * sx, bh); }
  return out;
}
/* Composición: frutas desenfocadas al fondo, flores en ASCII encima, glitch */
function drawCover(canvas, seed = 3) {
  const W = 720, H = 720; canvas.width = W; canvas.height = H; const g = canvas.getContext('2d');
  g.fillStyle = '#1a1220'; g.fillRect(0, 0, W, H);
  g.save(); g.filter = 'blur(26px)'; g.globalAlpha = .55; g.drawImage(drawFruits(W, H, seed + 2), 0, 0); g.restore();
  g.save(); g.globalAlpha = .35; g.filter = 'blur(10px)'; g.drawImage(drawFruits(W, H, seed + 9), 0, 0); g.restore();
  const flowers = drawFlowers(W, H, seed);
  g.save(); g.globalAlpha = .28; g.filter = 'blur(5px)'; g.drawImage(flowers, 0, 0); g.restore();
  g.drawImage(asciiFy(flowers, 7, 1.25), 0, 0);
  const out = glitch(canvas, seed, 1); g.clearRect(0, 0, W, H); g.drawImage(out, 0, 0);
}

/* ---------- Candado ---------- */
async function sha(str) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function lockGet() { try { return JSON.parse(localStorage.getItem(LOCK_KEY) || 'null'); } catch (e) { return null; } }
function isUnlocked() { if (typeof CLOUD !== 'undefined' && CLOUD.enabled) return !!CLOUD.user; try { return sessionStorage.getItem(UNLOCK_KEY) === '1'; } catch (e) { return true; } }
function unlockLocal() { try { sessionStorage.setItem(UNLOCK_KEY, '1'); } catch (e) {} S.locked = false; render(); }
function lockApp() { try { sessionStorage.removeItem(UNLOCK_KEY); } catch (e) {} S.locked = true; if (typeof CLOUD !== 'undefined' && CLOUD.user) cloudSignOut(); else render(); }

function coverHTML() {
  const lock = lockGet(); const email = (lock && lock.email) || (window.SUPABASE && window.SUPABASE.email) || '';
  return `<section class="login">
    <div class="login-art" aria-hidden="true"><div class="art-frame"><canvas id="cover-art"></canvas><span class="art-num">/01</span><span class="art-cap">Flores<br>y frutas</span></div></div>
    <div class="login-body">
      <h1 class="logo">raw money</h1>
      <form class="login-form" id="gate" autocomplete="on">
        <input type="email" name="email" value="${esc(email)}" autocomplete="username" hidden>
        <div class="field"><label for="gate-pw">Contraseña</label><input id="gate-pw" name="password" type="password" autocomplete="current-password" required></div>
        <p class="form-error" id="gate-err" aria-live="polite"></p>
        <button class="btn primary" type="submit">Entrar</button>
      </form>
    </div>
  </section>`;
}
function bindCover(root) {
  const cv = root.querySelector('#cover-art'); if (cv) { const draw = () => drawCover(cv, 3); if (document.fonts && document.fonts.load) document.fonts.load('600 10px "IBM Plex Mono"').then(draw, draw); else draw(); }
  const f = root.querySelector('#gate'); const err = root.querySelector('#gate-err'); const show = m => { err.textContent = m; };
  const cloud = typeof CLOUD !== 'undefined' && CLOUD.enabled; const lock = lockGet();
  f.addEventListener('submit', async e => {
    e.preventDefault(); show('');
    const email = f.email.value.trim().toLowerCase(); const pw = f.password.value;
    if (cloud) { const { error } = await CLOUD.client.auth.signInWithPassword({ email, password: pw }); if (error) show(/invalid/i.test(error.message) ? 'Correo o contraseña incorrectos' : error.message); return; }
    if (!lock) { if (pw.length < 6) { show('Contraseña incorrecta'); return; } try { localStorage.setItem(LOCK_KEY, JSON.stringify({ email, hash: await sha(email + '|' + pw) })); } catch (x) {} unlockLocal(); return; }
    if (email === lock.email && await sha(email + '|' + pw) === lock.hash) unlockLocal(); else show('Correo o contraseña incorrectos');
  });
  const first = f.querySelector('#gate-pw'); if (first && innerWidth > 900) first.focus();
}

/* Cambiar contraseña local (candado del navegador) */
function formLocalPassword() {
  const lock = lockGet();
  openDrawer({ title: 'Cambiar contraseña', eyebrow: 'Sesión', body: `${lock ? F.text('cur', 'Contraseña actual', '', '', 'type="password" autocomplete="current-password" required') : ''}${F.text('pw1', 'Nueva contraseña', '', '', 'type="password" autocomplete="new-password" required minlength="6"')}${F.text('pw2', 'Repite la nueva contraseña', '', '', 'type="password" autocomplete="new-password" required')}`, saveLabel: 'Guardar',
    onSave: async (o) => { const email = (lock && lock.email) || (window.SUPABASE && window.SUPABASE.email) || ''; if (lock && await sha(email + '|' + o.cur) !== lock.hash) { toast('La contraseña actual no es correcta'); return; } if (o.pw1.length < 6) { toast('Mínimo 6 caracteres'); return; } if (o.pw1 !== o.pw2) { toast('Las contraseñas no coinciden'); return; } try { localStorage.setItem(LOCK_KEY, JSON.stringify({ email, hash: await sha(email + '|' + o.pw1) })); } catch (x) {} closeDrawer(); toast('Contraseña actualizada'); } });
}

<script>
/* ===== Raw Money · shell, navegación y acciones ===== */
let toastT;
function toast(msg) { let el = document.querySelector('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); } el.textContent = msg; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2200); }
function confirmBox(title, text, onOk, okLabel = 'Eliminar') {
  const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = `<div class="box" role="alertdialog"><h3>${esc(title)}</h3><p>${esc(text)}</p><div class="acts"><button class="btn quiet" data-no>Cancelar</button><button class="btn ${okLabel === 'Eliminar' || okLabel === 'Borrar' ? 'danger' : 'primary'}" data-ok>${okLabel}</button></div></div>`;
  document.body.appendChild(m); m.querySelector('[data-no]').addEventListener('click', () => m.remove()); m.addEventListener('click', e => { if (e.target === m) m.remove(); }); m.querySelector('[data-ok]').addEventListener('click', () => { m.remove(); onOk(); }); m.querySelector('[data-ok]').focus();
}
function applyTheme() { let t = null; try { t = localStorage.getItem('midinero.theme'); } catch (e) {} document.documentElement.dataset.theme = t || 'dark'; }
function toggleTheme() { const root = document.documentElement; root.dataset.theme = isLightTheme() ? 'dark' : 'light'; try { localStorage.setItem('midinero.theme', root.dataset.theme); } catch (e) {} render(); }
async function exportJSON() {
  const json = JSON.stringify(S.data, null, 2); const filename = `raw-money-${todayISO()}.json`;
  if (window.claude && typeof window.claude.use === 'function') {
    // Dentro del visor de claude.ai: la descarga pasa por la capacidad "downloads" (el visor pide confirmación).
    const dl = await window.claude.use('downloads');
    if (dl) { try { await dl.save({ filename, data: json }); toast('Respaldo guardado'); } catch (e) { if (e && e.code !== 'declined') toast('No se pudo guardar el respaldo'); } return; }
    // Sin permiso de descarga: mostrar el JSON para copiarlo
    openDrawer({ title: 'Respaldo', eyebrow: 'Copia y guarda este texto', body: `<textarea class="inp" id="bk" rows="14" readonly style="font-family:ui-monospace,Menlo,monospace;font-size:12px">${esc(json)}</textarea><button type="button" class="btn secondary sm" id="bk-copy">${icon('check')}Copiar</button>` });
    document.getElementById('bk-copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(json); toast('Copiado'); } catch (e) { document.getElementById('bk').select(); toast('Selecciona y copia el texto'); } });
    return;
  }
  const blob = new Blob([json], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); toast('Respaldo descargado');
}

const ACTIONS = {
  'new-gasto': () => formTx(null, { type: 'gasto' }), 'new-ingreso': () => formTx(null, { type: 'ingreso', categoryId: 'sueldo', method: 'transferencia' }),
  'new-tarjeta': () => formCard(null), 'new-deuda': () => formDebt(null), 'new-meses': () => formInstallment(null), 'new-rec': () => formRecurring(null), 'new-cat': () => formCategory(null), 'new-acc': () => formAccount(null), 'new-budget': () => formBudget(null),
  'new-pago-tarjeta': () => formTx(null, { type: 'pago_tarjeta', targetId: (S.data.cards[0] || {}).id, method: 'transferencia' }), 'new-pago-deuda': () => formTx(null, { type: 'pago_deuda', targetId: (S.data.debts[0] || {}).id, method: 'transferencia' }),
  'export': exportJSON,
  'clear-demo': () => confirmBox('¿Borrar los datos de demostración?', 'Se eliminan movimientos, tarjetas, deudas y recurrentes de ejemplo. Las categorías se quedan para que empieces desde cero.', () => { S.data = emptyData(); saveData(); S.month = thisMonth(); render(); toast('Listo, empieza desde cero'); }, 'Borrar'),
  'load-demo': () => confirmBox('¿Cargar datos de demostración?', 'Reemplaza lo que tienes ahora por los datos de ejemplo.', () => { S.data = demoData(); saveData(); S.month = thisMonth(); render(); toast('Datos demo cargados'); }, 'Cargar'),
  'reset': () => confirmBox('¿Empezar de cero?', 'Se borra todo: movimientos, tarjetas, deudas, recurrentes y presupuestos.', () => { S.data = emptyData(); saveData(); S.month = thisMonth(); render(); toast('Todo limpio'); }, 'Borrar'),
  'more': () => openSheet(), 'theme': toggleTheme, 'lock': lockApp, 'today': () => { S.month = thisMonth(); render(); },
};

function openSheet() {
  closeDrawer();
  const veil = document.createElement('div'); veil.className = 'veil'; veil.addEventListener('click', closeDrawer);
  const sh = document.createElement('div'); sh.className = 'sheet';
  sh.innerHTML = `<div class="grab"></div><nav class="nav">${Object.entries(VIEWS).map(([k, v]) => `<a href="#${k}" class="${S.view === k ? 'on' : ''}">${icon(v.icon)}${v.title}</a>`).join('')}</nav><div class="chips" style="margin-top:12px"><button class="btn secondary sm" data-act="theme">${icon('moon')}Cambiar tema</button></div>`;
  document.body.append(veil, sh);
  sh.querySelectorAll('a').forEach(a => a.addEventListener('click', closeDrawer));
  sh.querySelector('[data-act=theme]').addEventListener('click', () => { toggleTheme(); });
}

function shell() {
  const navHtml = NAV_GROUPS.map(([g, keys]) => `<div class="grp">${g}</div>${keys.map(k => `<a href="#${k}" data-nav="${k}" class="${S.view === k ? 'on' : ''}">${icon(VIEWS[k].icon)}${VIEWS[k].title}</a>`).join('')}`).join('');
  return `
  <aside class="side"><a class="logo" href="#inicio"><i>$</i><span>Raw Money<small>finanzas personales</small></span></a><nav class="nav">${navHtml}</nav>
    <div class="foot">${S.data.demo ? '<div class="demo"><b>●</b> Datos de demostración</div>' : ''}${typeof CLOUD !== 'undefined' && CLOUD.enabled ? `<div class="demo"><i class="cloud-dot ${CLOUD.user ? 'on' : ''}"></i> ${CLOUD.user ? 'Nube: ' + esc(CLOUD.user.email) : 'Nube: sin sesión'}</div>` : ''}<button class="btn secondary sm theme-side" data-act="theme">${icon('moon','i moon')}${icon('sun','i sun')}Tema</button></div></aside>
  <div class="main">
    <header class="top"><div class="in"><a class="logo" href="#inicio" style="display:none" id="mlogo"><i>$</i></a><div class="ttl">${VIEWS[S.view].title}</div><span class="sp"></span>
      <div class="monthsel"><button data-m="-1" aria-label="Mes anterior">${icon('chevL')}</button><button class="cur${isPast(S.month) ? ' past' : ''}" data-act="pick" title="Ir al mes actual">${monthLabel(S.month)}</button><button data-m="1" aria-label="Mes siguiente">${icon('chevR')}</button></div>
      ${S.month !== thisMonth() ? `<button class="btn quiet sm" data-act="today">Hoy</button>` : ''}
      <button class="theme" data-act="theme" aria-label="Cambiar tema"><svg class="i sun" viewBox="0 0 24 24">${ICONS.sun}</svg><svg class="i moon" viewBox="0 0 24 24">${ICONS.moon}</svg></button></div></header>
    <main class="content" id="content"></main>
  </div>
  <nav class="bottom"><a href="#inicio" class="${S.view === 'inicio' ? 'on' : ''}">${icon('home2')}<span>Inicio</span></a><a href="#movimientos" class="${S.view === 'movimientos' ? 'on' : ''}">${icon('list')}<span>Movimientos</span></a><a href="#inicio" class="fab" data-act="new-gasto" aria-label="Registrar gasto"><i>${icon('plus')}</i><span>Gasto</span></a><a href="#tarjetas" class="${S.view === 'tarjetas' ? 'on' : ''}">${icon('card')}<span>Tarjetas</span></a><a href="#inicio" class="${['gastos', 'resumen', 'historial', 'deudas', 'recurrentes', 'calendario', 'presupuesto', 'categorias', 'ajustes'].includes(S.view) ? 'on' : ''}" data-act="more">${icon('more')}<span>Más</span></a></nav>`;
}

function render() {
  const app = document.getElementById('app');
  if (S.locked) { app.className = ''; app.innerHTML = coverHTML(); bindCover(app); document.title = 'Raw Money'; window.scrollTo(0, 0); return; }
  app.className = 'app';
  materializeRecurring(S.month);
  const scrollY = window.scrollY;
  app.innerHTML = shell();
  const content = app.querySelector('#content');
  const v = VIEWS[S.view] || VIEWS.inicio;
  content.innerHTML = v.fn();
  if (v.bind) v.bind(content);
  bindTips(app);
  // navegación y acciones
  app.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => { S.month = addMonths(S.month, Number(b.dataset.m)); S.histB = S.month; render(); }));
  app.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', e => { const a = b.dataset.act; if (a === 'pick') { S.month = thisMonth(); render(); return; } if (ACTIONS[a]) { e.preventDefault(); ACTIONS[a](); } }));
  app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.go; }));
  app.querySelectorAll('[data-tx]').forEach(r => r.addEventListener('click', () => formTx(byId(S.data.transactions, r.dataset.tx))));
  app.querySelectorAll('[data-card]').forEach(r => r.addEventListener('click', () => detailCard(byId(S.data.cards, r.dataset.card))));
  app.querySelectorAll('[data-debt]').forEach(r => r.addEventListener('click', () => detailDebt(byId(S.data.debts, r.dataset.debt))));
  app.querySelectorAll('[data-ins]').forEach(r => r.addEventListener('click', () => formInstallment(byId(S.data.installments, r.dataset.ins))));
  app.querySelectorAll('[data-rec]').forEach(r => r.addEventListener('click', () => formRecurring(byId(S.data.recurring, r.dataset.rec))));
  app.querySelectorAll('[data-cat]').forEach(r => r.addEventListener('click', () => formCategory(byId(S.data.categories, r.dataset.cat))));
  app.querySelectorAll('[data-acc]').forEach(r => r.addEventListener('click', () => formAccount(byId(S.data.accounts, r.dataset.acc))));
  app.querySelectorAll('[data-budget]').forEach(r => r.addEventListener('click', () => formBudget(r.dataset.budget)));
  app.querySelectorAll('[data-ev]').forEach(r => r.addEventListener('click', () => { const [kind, id] = r.dataset.ev.split(':'); if (kind === 'tarjeta' || kind === 'corte') detailCard(byId(S.data.cards, id)); else if (kind === 'deuda') detailDebt(byId(S.data.debts, id)); else if (kind === 'meses') formInstallment(byId(S.data.installments, id)); else formTx(byId(S.data.transactions, id)); }));
  // leyenda ↔ donut
  app.querySelectorAll('.legend .l').forEach(l => { const key = l.dataset.key; const wrap = l.closest('.donutwrap'); l.addEventListener('mouseenter', () => { wrap.querySelectorAll('.donut path').forEach(p => p.style.opacity = p.dataset.key === key ? 1 : .25); wrap.querySelectorAll('.legend .l').forEach(x => x.classList.toggle('dim', x !== l)); }); l.addEventListener('mouseleave', () => { wrap.querySelectorAll('.donut path').forEach(p => p.style.opacity = 1); wrap.querySelectorAll('.legend .l').forEach(x => x.classList.remove('dim')); }); });
  document.title = `${v.title} · Raw Money`;
  window.scrollTo(0, S._keepScroll ? scrollY : 0); S._keepScroll = false;
}

function route() { const h = location.hash.replace('#', '') || 'inicio'; if (VIEWS[h]) { if (h !== S.view) S.filters = h === 'movimientos' ? S.filters : {}; S.view = h; } else S.view = 'inicio'; closeDrawer(); render(); }
function init() {
  applyTheme();
  S.data = loadData() || (window.START_EMPTY ? emptyData() : demoData()); saveData();
  S.month = thisMonth();
  S.locked = !isUnlocked();
  window.addEventListener('hashchange', route);
  route();
  if (typeof initCloud === 'function') initCloud().then(() => { S.locked = !isUnlocked(); render(); });
}
document.addEventListener('DOMContentLoaded', init);

</script>
