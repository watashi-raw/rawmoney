<script>
/* ===== Raw Money · cálculos dinámicos ===== */

/* Materializa gastos recurrentes del mes como movimientos reales (idempotente). */
function materializeRecurring(ym) {
  const d = S.data; let changed = false;
  d.recurring.forEach(r => {
    if (!r.active || !r.start || ym < r.start) return;
    if (r.end && ym > r.end) return;
    const [sy, sm] = r.start.split('-').map(Number); const [y, m] = ym.split('-').map(Number);
    const diff = (y - sy) * 12 + (m - sm);
    let days = [];
    if (r.freq === 'mensual') days = [r.day];
    else if (r.freq === 'quincenal') days = [r.day, Math.min(r.day + 15, daysIn(ym))];
    else if (r.freq === 'semanal') days = [r.day, r.day + 7, r.day + 14, r.day + 21].filter(x => x <= daysIn(ym));
    else if (r.freq === 'bimestral') { if (diff % 2 !== 0) return; days = [r.day]; }
    else if (r.freq === 'anual') { if (diff % 12 !== 0) return; days = [r.day]; }
    days.forEach((day, i) => {
      const id = `rec_${r.id}_${ym}_${i}`;
      if (d.skips.includes(id) || d.transactions.some(t => t.id === id)) return;
      d.transactions.push({ id, date: clampDay(ym, day), desc: r.name, amount: r.amount, type: 'gasto', categoryId: r.categoryId, method: r.method, accountId: r.accountId, fixed: true, notes: '', recurringId: r.id });
      changed = true;
    });
  });
  if (changed) saveData();
}

const inMonth = (t, ym) => t.date.slice(0, 7) === ym;
const upTo = (t, ym) => t.date.slice(0, 7) <= ym;
const sum = (arr, f = x => x.amount) => arr.reduce((a, x) => a + (Number(f(x)) || 0), 0);
const isCash = t => t.method !== 'credito';

/* Compras a meses */
function installmentInfo(ins, ym) {
  const monthly = ins.total / ins.months;
  const end = addMonths(ins.start, ins.months - 1);
  const [sy, sm] = ins.start.split('-').map(Number); const [y, m] = ym.split('-').map(Number);
  const idx = (y - sy) * 12 + (m - sm); // 0-based nº de mensualidad en ym
  const paidCount = Math.max(0, Math.min(ins.months, idx + 1));
  const active = idx >= 0 && idx < ins.months;
  const remaining = ins.months - paidCount;
  return { monthly, end, idx, paidCount, active, remaining, pending: remaining * monthly, chargedToDate: paidCount * monthly, future: idx < 0 };
}

/* Saldo de tarjeta al cierre del mes ym: inicial + compras a crédito + mensualidades cargadas − pagos */
function cardBalance(card, ym) {
  const T = S.data.transactions;
  const purchases = sum(T.filter(t => t.type === 'gasto' && t.method === 'credito' && t.accountId === card.id && upTo(t, ym)));
  const inst = sum(S.data.installments.filter(i => i.cardId === card.id), i => installmentInfo(i, ym).chargedToDate);
  const payments = sum(T.filter(t => t.type === 'pago_tarjeta' && t.targetId === card.id && upTo(t, ym)));
  return Math.max(0, (card.opening || 0) + purchases + inst - payments);
}
function cardMonth(card, ym) {
  const T = S.data.transactions;
  const bal = cardBalance(card, ym);
  const prev = cardBalance(card, addMonths(ym, -1));
  const purchases = sum(T.filter(t => t.type === 'gasto' && t.method === 'credito' && t.accountId === card.id && inMonth(t, ym)));
  const instMonthly = sum(S.data.installments.filter(i => i.cardId === card.id && installmentInfo(i, ym).active), i => installmentInfo(i, ym).monthly);
  const paid = sum(T.filter(t => t.type === 'pago_tarjeta' && t.targetId === card.id && inMonth(t, ym)));
  const util = card.limit ? bal / card.limit * 100 : 0;
  const minPay = card.minAmount || Math.round(bal * ((card.minPct || 5) / 100));
  const noInterest = card.noInterest != null && card.noInterest !== '' ? Number(card.noInterest) : prev; // lo que cerró el mes anterior
  const payDate = clampDay(ym, card.payDay || 1);
  const status = paid >= Math.min(noInterest, prev) && prev > 0 ? 'pagado' : paid > 0 ? 'parcial' : (todayISO() > payDate && ym <= thisMonth() && prev > 0 ? 'vencido' : 'pendiente');
  return { bal, prev, purchases, instMonthly, paid, util, minPay, noInterest, payDate, status, available: Math.max(0, (card.limit || 0) - bal) };
}

/* Deudas */
function debtInfo(debt, ym) {
  const T = S.data.transactions;
  const paidTx = sum(T.filter(t => t.type === 'pago_deuda' && t.targetId === debt.id && upTo(t, ym)));
  const pending = Math.max(0, (debt.initial || 0) - paidTx);
  const paidTotal = (debt.original || 0) - pending;
  const progress = debt.original ? paidTotal / debt.original * 100 : 0;
  const paidThisMonth = sum(T.filter(t => t.type === 'pago_deuda' && t.targetId === debt.id && inMonth(t, ym)));
  const monthsLeft = debt.monthly > 0 ? Math.ceil(pending / debt.monthly) : null;
  const endMonth = monthsLeft != null ? addMonths(ym, monthsLeft) : null;
  const payDate = clampDay(ym, debt.payDay || 1);
  return { pending, paidTotal, progress, paidThisMonth, monthsLeft, endMonth, payDate, status: paidThisMonth >= (debt.monthly || 0) && debt.monthly > 0 ? 'pagado' : paidThisMonth > 0 ? 'parcial' : 'pendiente', done: pending <= 0 };
}

/* Saldo de cuentas (débito / efectivo) al cierre del mes */
function accountBalance(acc, ym) {
  const T = S.data.transactions.filter(t => upTo(t, ym));
  let b = acc.opening || 0;
  T.forEach(t => {
    if (t.type === 'ingreso' && t.accountId === acc.id) b += t.amount;
    else if (t.type === 'gasto' && t.accountId === acc.id && t.method !== 'credito') b -= t.amount;
    else if ((t.type === 'pago_tarjeta' || t.type === 'pago_deuda' || t.type === 'ahorro') && t.accountId === acc.id) b -= t.amount;
    else if (t.type === 'transferencia') { if (t.accountId === acc.id) b -= t.amount; if (t.targetId === acc.id) b += t.amount; }
  });
  return b;
}
const savingsTotal = ym => sum(S.data.transactions.filter(t => t.type === 'ahorro' && (ym ? upTo(t, ym) : true)));

/* Resumen mensual */
function monthSummary(ym) {
  const d = S.data; const T = d.transactions.filter(t => inMonth(t, ym));
  const gastos = T.filter(t => t.type === 'gasto');
  const instItems = d.installments.map(i => ({ ins: i, info: installmentInfo(i, ym) })).filter(x => x.info.active);
  const instMonthly = sum(instItems, x => x.info.monthly);
  const ingresos = sum(T.filter(t => t.type === 'ingreso'));
  const gastosTx = sum(gastos);
  const gastosTotal = gastosTx + instMonthly;
  const fijos = sum(gastos.filter(t => t.fixed)) + instMonthly;
  const variables = gastosTx - sum(gastos.filter(t => t.fixed));
  const gastosCash = sum(gastos.filter(isCash));
  const gastosCredito = sum(gastos.filter(t => !isCash(t))) + instMonthly;
  const pagosTarjeta = sum(T.filter(t => t.type === 'pago_tarjeta'));
  const pagosDeuda = sum(T.filter(t => t.type === 'pago_deuda'));
  const ahorro = sum(T.filter(t => t.type === 'ahorro'));
  const queda = ingresos - gastosCash - pagosTarjeta - pagosDeuda - ahorro;
  const byCat = {};
  gastos.forEach(t => { byCat[t.categoryId || 'otros'] = (byCat[t.categoryId || 'otros'] || 0) + t.amount; });
  instItems.forEach(x => { const c = x.ins.categoryId || 'compras'; byCat[c] = (byCat[c] || 0) + x.info.monthly; });
  const cards = d.cards.map(c => ({ card: c, m: cardMonth(c, ym) }));
  const debts = d.debts.map(x => ({ debt: x, i: debtInfo(x, ym) }));
  const tarjetasTotal = sum(cards, x => x.m.bal);
  const deudasTotal = sum(debts, x => x.i.pending);
  const disponibleCuentas = sum(d.accounts, a => accountBalance(a, ym));
  // comprometido: pagos que aún faltan en el mes (tarjetas, deudas, recurrentes futuros, mensualidades)
  const today = todayISO();
  let comprometido = 0; const compItems = [];
  cards.forEach(({ card, m }) => { const due = Math.max(0, Math.min(m.noInterest, m.prev) - m.paid); if (due > 0 && ym >= thisMonth()) { comprometido += due; compItems.push({ kind: 'tarjeta', name: card.name, amount: due, date: m.payDate }); } });
  debts.forEach(({ debt, i }) => { const due = Math.max(0, (debt.monthly || 0) - i.paidThisMonth); if (due > 0 && !i.done && ym >= thisMonth()) { comprometido += due; compItems.push({ kind: 'deuda', name: debt.name, amount: due, date: i.payDate }); } });
  gastos.filter(t => t.recurringId && t.date > today && ym >= thisMonth() && isCash(t)).forEach(t => { comprometido += t.amount; compItems.push({ kind: 'recurrente', name: t.desc, amount: t.amount, date: t.date }); });
  return { ym, ingresos, gastosTotal, gastosTx, fijos, variables, gastosCash, gastosCredito, pagosTarjeta, pagosDeuda, ahorro, queda, byCat, cards, debts, tarjetasTotal, deudasTotal, disponibleCuentas, instMonthly, instItems, comprometido, compItems, ahorroPct: ingresos ? ahorro / ingresos * 100 : 0, savings: savingsTotal(ym), count: T.length };
}

/* Ranking de categorías + comparación con mes anterior */
function categoryRanking(ym) {
  const cur = monthSummary(ym).byCat; const prev = monthSummary(addMonths(ym, -1)).byCat;
  const total = Object.values(cur).reduce((a, b) => a + b, 0);
  return Object.entries(cur).map(([id, v]) => ({ cat: cat(id), v, share: total ? v / total * 100 : 0, prev: prev[id] || 0, delta: prev[id] ? (v - prev[id]) / prev[id] * 100 : null })).sort((a, b) => b.v - a.v);
}

/* Presupuestos */
function budgetStatus(ym) {
  const byCat = monthSummary(ym).byCat;
  return Object.entries(S.data.budgets).filter(([, b]) => b > 0).map(([id, b]) => { const spent = byCat[id] || 0; return { cat: cat(id), budget: b, spent, left: b - spent, pct: spent / b * 100, over: spent > b }; }).sort((a, b) => b.pct - a.pct);
}

/* Eventos del calendario */
function monthEvents(ym) {
  const d = S.data; const ev = []; const T = d.transactions.filter(t => inMonth(t, ym));
  d.cards.forEach(c => { const m = cardMonth(c, ym); const amt = Math.min(m.noInterest, m.prev) || m.bal; if (amt > 0 || m.prev > 0) ev.push({ date: m.payDate, kind: 'tarjeta', name: `Pago ${c.name}`, amount: amt, paid: m.status === 'pagado', id: c.id, sub: `Mínimo ${money0(m.minPay)}` }); ev.push({ date: clampDay(ym, c.cutDay || 1), kind: 'corte', name: `Corte ${c.name}`, amount: null, paid: false, id: c.id }); });
  d.debts.forEach(x => { const i = debtInfo(x, ym); if (!i.done) ev.push({ date: i.payDate, kind: 'deuda', name: x.name, amount: x.monthly, paid: i.status === 'pagado', id: x.id, sub: x.creditor }); });
  T.filter(t => t.recurringId).forEach(t => { const r = byId(d.recurring, t.recurringId); ev.push({ date: t.date, kind: cat(t.categoryId).id === 'suscripciones' ? 'suscripcion' : 'recurrente', name: t.desc, amount: t.amount, paid: t.date <= todayISO(), id: t.id, sub: METHODS[t.method] }); });
  d.installments.forEach(i => { const info = installmentInfo(i, ym); if (info.active) { const c = byId(d.cards, i.cardId); ev.push({ date: clampDay(ym, (c && c.cutDay) || 1), kind: 'meses', name: `${i.desc} (${info.paidCount}/${i.months})`, amount: info.monthly, paid: false, id: i.id, sub: c ? c.name : '' }); } });
  return ev.sort((a, b) => a.date.localeCompare(b.date));
}

/* Historial: lista de meses con datos */
function monthsWithData() {
  const set = new Set(S.data.transactions.map(t => t.date.slice(0, 7)));
  set.add(thisMonth());
  return [...set].sort();
}
function historySeries(n = 6, endYm = S.month) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) { const ym = addMonths(endYm, -i); out.push({ ym, ...monthSummary(ym) }); }
  return out;
}

<script>
/* ===== Raw Money · gráficos SVG minimalistas (una escala, hover, sin librerías) ===== */
let tipEl;
function tipShow(html, x, y) { if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tip'; document.body.appendChild(tipEl); } tipEl.innerHTML = html; tipEl.classList.add('show'); const w = tipEl.offsetWidth, h = tipEl.offsetHeight; let lx = x + 14, ly = y + 14; if (lx + w > innerWidth - 8) lx = x - w - 14; if (ly + h > innerHeight - 8) ly = y - h - 14; tipEl.style.left = lx + 'px'; tipEl.style.top = ly + 'px'; }
function tipHide() { if (tipEl) tipEl.classList.remove('show'); }
function bindTips(root) {
  root.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mousemove', e => tipShow(el.dataset.tip, e.clientX, e.clientY));
    el.addEventListener('mouseleave', tipHide);
    el.addEventListener('touchstart', e => { const t = e.touches[0]; tipShow(el.dataset.tip, t.clientX, t.clientY); setTimeout(tipHide, 1800); }, { passive: true });
  });
}
const nice = max => { if (max <= 0) return 1000; const p = Math.pow(10, Math.floor(Math.log10(max))); const f = max / p; const n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10; return n * p; };
const kfmt = v => v >= 1000 ? `${Math.round(v / 1000)}k` : String(Math.round(v));

/* Donut: items [{label, value, color}] */
function donutSVG(items, centerLabel, centerValue) {
  const total = items.reduce((a, x) => a + x.value, 0);
  const R = 84, r = 60, cx = 100, cy = 100; let a0 = -Math.PI / 2; const gap = total ? 0.03 : 0;
  const arcs = items.map(it => {
    const frac = total ? it.value / total : 0; const a1 = a0 + frac * Math.PI * 2;
    const s = a0 + gap / 2, e = a1 - gap / 2; let path = '';
    if (frac > 0.005) {
      const big = (e - s) > Math.PI ? 1 : 0;
      const p = (rad, ang) => `${(cx + rad * Math.cos(ang)).toFixed(2)},${(cy + rad * Math.sin(ang)).toFixed(2)}`;
      path = `M${p(R, s)} A${R},${R} 0 ${big} 1 ${p(R, e)} L${p(r, e)} A${r},${r} 0 ${big} 0 ${p(r, s)} Z`;
    }
    a0 = a1;
    return `<path d="${path}" fill="${it.color}" data-tip="<b>${esc(it.label)}</b>${money0(it.value)} · ${pct(frac * 100)}" data-key="${esc(it.key || it.label)}"></path>`;
  }).join('');
  const empty = total ? '' : `<circle cx="${cx}" cy="${cy}" r="${(R + r) / 2}" fill="none" stroke="var(--surface-3)" stroke-width="${R - r}"/>`;
  return `<div class="donut"><svg viewBox="0 0 200 200">${empty}${arcs}</svg><div class="c"><b>${centerValue}</b><span>${centerLabel}</span></div></div>`;
}

/* Líneas múltiples (misma unidad): series [{name,color,values[]}], labels[] */
function linesSVG(labels, series, opts = {}) {
  const W = 640, H = opts.h || 220, pl = 44, pr = 12, pt = 14, pb = 28; const iw = W - pl - pr, ih = H - pt - pb;
  const max = nice(Math.max(1, ...series.flatMap(s => s.values)));
  const n = labels.length; const x = i => pl + (n > 1 ? i / (n - 1) * iw : iw / 2); const y = v => pt + ih - v / max * ih;
  const ticks = [0, .25, .5, .75, 1].map(f => f * max);
  const grid = ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/>`).join('');
  const ylab = ticks.map(t => `<text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end">${kfmt(t)}</text>`).join('');
  const xlab = labels.map((l, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`).join('');
  const paths = series.map(s => {
    const d = s.values.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const area = opts.area ? `<path d="${d} L${x(n - 1)},${y(0)} L${x(0)},${y(0)} Z" fill="${s.color}" opacity=".08"/>` : '';
    const last = s.values.length - 1;
    return `${area}<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(last)}" cy="${y(s.values[last])}" r="4" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`;
  }).join('');
  const hits = labels.map((l, i) => { const rows = series.map(s => `<i style='color:${s.color};font-style:normal'>●</i> ${esc(s.name)}: ${money0(s.values[i])}`).join('<br>'); return `<rect x="${x(i) - iw / (2 * Math.max(1, n - 1))}" y="${pt}" width="${iw / Math.max(1, n - 1)}" height="${ih}" fill="transparent" data-tip="<b>${esc(l)}</b>${rows}"/>`; }).join('');
  const dots = series.map(s => s.values.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${s.color}" pointer-events="none"/>`).join('')).join('');
  const legend = series.length > 1 ? `<div class="leg2">${series.map(s => `<span><i style="--c:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}"><g class="grid">${grid}</g>${ylab}${xlab}${paths}${dots}${hits}</svg>${legend}</div>`;
}

/* Barras agrupadas o apiladas: labels[], series [{name,color,values}] */
function barsSVG(labels, series, opts = {}) {
  const W = 640, H = opts.h || 220, pl = 44, pr = 12, pt = 14, pb = 28; const iw = W - pl - pr, ih = H - pt - pb;
  const stacked = !!opts.stacked; const n = labels.length;
  const maxV = stacked ? Math.max(1, ...labels.map((_, i) => series.reduce((a, s) => a + s.values[i], 0))) : Math.max(1, ...series.flatMap(s => s.values));
  const max = nice(maxV); const y = v => pt + ih - v / max * ih;
  const slot = iw / n; const bw = stacked ? Math.min(34, slot * .55) : Math.min(22, slot * .7 / series.length);
  const ticks = [0, .25, .5, .75, 1].map(f => f * max);
  const grid = ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/>`).join('');
  const ylab = ticks.map(t => `<text x="${pl - 8}" y="${y(t) + 4}" text-anchor="end">${kfmt(t)}</text>`).join('');
  const xlab = labels.map((l, i) => `<text x="${pl + slot * (i + .5)}" y="${H - 8}" text-anchor="middle">${esc(l)}</text>`).join('');
  let bars = '';
  labels.forEach((l, i) => {
    const cx = pl + slot * (i + .5);
    if (stacked) {
      let acc = 0;
      series.forEach(s => { const v = s.values[i]; if (v <= 0) return; const y1 = y(acc + v), y0 = y(acc); bars += `<rect x="${cx - bw / 2}" y="${y1}" width="${bw}" height="${Math.max(0, y0 - y1 - 1)}" rx="2" fill="${s.color}" data-tip="<b>${esc(l)} · ${esc(s.name)}</b>${money0(v)}"/>`; acc += v; });
    } else {
      const gw = bw * series.length + 3 * (series.length - 1); const x0 = cx - gw / 2;
      series.forEach((s, k) => { const v = s.values[i]; const h = Math.max(0, y(0) - y(v)); bars += `<rect x="${x0 + k * (bw + 3)}" y="${y(v)}" width="${bw}" height="${h}" rx="3" fill="${s.color}" data-tip="<b>${esc(l)} · ${esc(s.name)}</b>${money0(v)}"/>`; });
    }
  });
  const legend = series.length > 1 ? `<div class="leg2">${series.map(s => `<span><i class="sq" style="--c:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}"><g class="grid">${grid}</g>${ylab}${xlab}${bars}</svg>${legend}</div>`;
}

/* Flujo de ingreso: sankey simple de una fuente a varios destinos */
function flowSVG(total, parts) {
  const W = 640, H = 240, left = 30, right = 430, bw = 26, pt = 12, pb = 12; const ih = H - pt - pb;
  const sumP = parts.reduce((a, p) => a + Math.max(0, p.value), 0);
  const scale = total > 0 ? ih / Math.max(total, sumP) : 0;
  const gap = 8; let yR = pt, yL = pt; let out = '';
  const srcH = total * scale;
  out += `<rect x="${left}" y="${pt}" width="${bw}" height="${srcH}" rx="4" fill="var(--green)"/><text x="${left + bw + 8}" y="${pt + 14}" style="fill:var(--ink);font-weight:700;font-size:12px">Ingresos</text><text x="${left + bw + 8}" y="${pt + 30}" style="fill:var(--ink-2);font-size:12px">${money0(total)}</text>`;
  const usable = ih - gap * (parts.length - 1);
  const pScale = sumP > 0 ? usable / Math.max(total, sumP) : 0;
  parts.forEach(p => {
    const v = Math.max(0, p.value); if (v <= 0) return;
    const h = v * pScale; const hl = v * scale;
    const y0 = yL, y1 = yR;
    const x0 = left + bw, x1 = right; const c = (x0 + x1) / 2;
    out += `<path d="M${x0},${y0} C${c},${y0} ${c},${y1} ${x1},${y1} L${x1},${y1 + h} C${c},${y1 + h} ${c},${y0 + hl} ${x0},${y0 + hl} Z" fill="${p.color}" opacity=".28" data-tip="<b>${esc(p.name)}</b>${money0(v)} · ${pct(total ? v / total * 100 : 0)}"/>`;
    out += `<rect x="${x1}" y="${y1}" width="${bw}" height="${h}" rx="4" fill="${p.color}"/>`;
    const ty = y1 + Math.max(h / 2, 6);
    out += `<text x="${x1 + bw + 8}" y="${ty + 4}" style="fill:var(--ink);font-weight:600;font-size:12px">${esc(p.name)} <tspan style="fill:var(--ink-3);font-weight:500">${money0(v)} · ${pct(total ? v / total * 100 : 0)}</tspan></text>`;
    yL += hl; yR += h + gap;
  });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${out}</svg></div>`;
}

  <script>
/* ===== Raw Money · vistas ===== */
const catStyle = c => `--cat:${col(c.color)};--cat-soft:color-mix(in srgb, ${col(c.color)} 16%, var(--surface))`;
const catIcon = (c, cls = 'ic') => `<span class="${cls}" style="${catStyle(c)}">${icon(c.icon)}</span>`;
const KIND_COLOR = { tarjeta: 'var(--plum)', deuda: 'var(--bad)', recurrente: 'var(--warn)', suscripcion: 'var(--plum-deep)', meses: 'var(--ink-3)', corte: 'var(--line-strong)' };
const KIND_LABEL = { tarjeta: 'Tarjeta', deuda: 'Deuda', recurrente: 'Recurrente', suscripcion: 'Suscripción', meses: 'A meses', corte: 'Corte' };
const statusTag = s => ({ pagado: '<span class="tag good">Pagado</span>', parcial: '<span class="tag warn">Parcial</span>', vencido: '<span class="tag bad">Vencido</span>', pendiente: '<span class="tag warn">Pendiente</span>' }[s] || '');
const deltaTag = d => d == null ? '<span class="delta new">nuevo</span>' : Math.abs(d) < 1 ? '<span class="delta">=</span>' : d > 0 ? `<span class="delta up">+${Math.round(d)}%</span>` : `<span class="delta down">${Math.round(d)}%</span>`;
const isPast = ym => ym < thisMonth();
/* Logo: la r itálica con su punto, como el favicon */
const LOGO = { toString: () => `<span class="mark tiger" aria-hidden="true">${tigerSvg()}</span>` }; // un SVG con ids únicos cada vez que se pinta
/* Lo que se puede registrar: [acción, título, ayuda, ícono, tono] */
const ADD_OPTS = [['new-gasto', 'Gasté', 'Una compra o un pago', 'bag', 'berry'], ['new-ingreso', 'Me pagaron', 'Sueldo, venta, regalo', 'arrowDown', 'sprout'], ['new-pago-tarjeta', 'Pagué la tarjeta', 'Abono a tu tarjeta', 'card', 'malaga'], ['new-pago-deuda', 'Abono a una deuda', 'Préstamo o crédito', 'bank', 'bison'], ['new-ahorro', 'Ahorré', 'Apartar dinero', 'piggy', 'oasis'], ['new-transfer', 'Moví dinero', 'Entre mis cuentas', 'swap', 'brush']];

function txRow(t, click = true) {
  const c = t.type === 'gasto' || t.type === 'ingreso' ? cat(t.categoryId) : null;
  const meta = { ingreso: { ic: 'arrowDown', col: 'var(--green)', sign: '+' }, gasto: { ic: null, col: null, sign: '−' }, transferencia: { ic: 'swap', col: 'var(--ink-3)', sign: '' }, pago_deuda: { ic: 'bank', col: 'var(--bad)', sign: '−' }, pago_tarjeta: { ic: 'card', col: 'var(--plum)', sign: '−' }, ahorro: { ic: 'piggy', col: 'var(--green)', sign: '' } }[t.type];
  const ic = c ? catIcon(c) : `<span class="ic" style="--cat:${meta.col};--cat-soft:color-mix(in srgb, ${meta.col} 14%, var(--surface))">${icon(meta.ic)}</span>`;
  const sub = [c ? c.name : TYPES[t.type], t.type === 'transferencia' ? `${accountName(t.accountId)} → ${accountName(t.targetId)}` : t.type === 'pago_tarjeta' ? `a ${accountName(t.targetId)}` : t.type === 'pago_deuda' ? `a ${(byId(S.data.debts, t.targetId) || {}).name || '—'}` : accountName(t.accountId), METHODS[t.method]].filter(Boolean).join(' · ');
  const tags = `${t.recurringId ? '<span class="tag rec">Recurrente</span>' : t.fixed && t.type === 'gasto' ? '<span class="tag">Fijo</span>' : ''}`;
  const cls = t.type === 'ingreso' || t.type === 'ahorro' ? 'pos' : t.type === 'pago_deuda' ? 'neg' : t.type === 'transferencia' ? 'mut' : '';
  return `<div class="row${click ? ' click' : ''}" data-tx="${t.id}">${ic}<div class="tx"><b>${esc(t.desc)} ${tags}</b><span>${dateLabel(t.date)} · ${esc(sub)}</span></div><div class="am ${cls}">${meta.sign}${money(t.amount)}</div></div>`;
}

/* ---------- INICIO ---------- */
const daysUntil = iso => Math.round((new Date(iso + 'T12:00') - new Date(todayISO() + 'T12:00')) / 864e5);
const whenLabel = iso => { const d = daysUntil(iso); return d < 0 ? `hace ${-d} día${d === -1 ? '' : 's'}` : d === 0 ? 'hoy' : d === 1 ? 'mañana' : `en ${d} días`; };
function viewInicio() {
  const ym = S.month; const s = monthSummary(ym); const rank = categoryRanking(ym).slice(0, 5);
  const bud = budgetStatus(ym).slice(0, 4);
  const recent = S.data.transactions.filter(t => inMonth(t, ym)).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6);
  const today = todayISO();
  const upcoming = monthEvents(ym).filter(e => e.kind !== 'corte' && !e.paid && (ym > thisMonth() || e.date >= today)).slice(0, 6);
  const donutItems = rank.map(r => ({ label: r.cat.name, value: r.v, color: col(r.cat.color), key: r.cat.id }));
  const rest = categoryRanking(ym).slice(5); if (rest.length) donutItems.push({ label: 'Otras', value: sum(rest, r => r.v), color: col(OTHERS_COLOR), key: 'rest' });
  const past = isPast(ym), cur = ym === thisMonth(), mes = MESES[Number(ym.slice(5)) - 1];
  const dLeft = cur ? daysIn(ym) - Number(todayISO().slice(8)) + 1 : past ? 0 : daysIn(ym);
  const perDay = dLeft && s.queda > 0 ? s.queda / dLeft : 0;
  const usedPct = s.ingresos ? Math.min(100, Math.max(0, (s.ingresos - s.queda) / s.ingresos * 100)) : 0;
  const over = s.queda < 0, noIn = !s.ingresos;
  const say = noIn && over ? `Aún no registras lo que te pagaron en ${mes}. Cuando lo hagas, aquí verás cuánto te queda.` : over ? `Entre gastos y pagos salió más de lo que entró en ${mes}. Mira abajo en qué se fue.`
    : cur ? `para los ${dLeft} día${dLeft === 1 ? '' : 's'} que faltan de ${mes}.${perDay ? ` Son unos <b>${money0(perDay)}</b> al día.` : ''}`
    : past ? `fue lo que sobró en ${mes}.` : `para ${mes}, si todo sale como está planeado.`;
  return `
  <div class="ph"><div><div class="eyebrow">${past ? 'Así cerró' : cur ? 'Hoy, ' + dateLong(todayISO()) : 'Mirando adelante'}</div><h1 class="squig">${past ? 'Así te fue' : 'Así vas'} en ${mes}</h1></div></div>
  <section class="hero${over && !noIn ? ' over' : ''}">
    <div class="hl">
      <pre class="ascii" aria-hidden="true">${asciiArt(40, 13, 7)}</pre>
      <div class="eyebrow">${noIn && over ? 'Han salido' : over ? 'Te pasaste por' : 'Te quedan'}</div>
      <div class="big num">${money0(Math.abs(s.queda))}</div>
      <p class="say">${say}</p>
      ${s.ingresos ? `<div class="meter" role="img" aria-label="Usaste ${pct(usedPct)} de lo que entró"><i style="width:${usedPct}%"></i></div><div class="meter-l"><span>Ya usaste ${pct(usedPct)} de lo que entró</span><span>Entró ${money0(s.ingresos)}</span></div>` : noIn && over ? '' : '<p class="say">Registra lo que te pagaron este mes y aquí verás cuánto te queda.</p>'}
    </div>
    <div class="stub">
      <div class="ledger"><span>${icon('wallet')}Tengo en cuentas</span><b class="num">${money0(s.disponibleCuentas)}</b><small>${S.data.accounts.map(a => `${esc(a.name)} ${money0(accountBalance(a, ym))}`).join(' · ') || 'Agrega una cuenta en Ajustes'}</small></div>
      <div class="ledger"><span>${icon('cal')}Por pagar este mes</span><b class="num">${money0(s.comprometido)}</b><small>${s.compItems.length ? `${s.compItems.length} pago${s.compItems.length > 1 ? 's' : ''} pendiente${s.compItems.length > 1 ? 's' : ''}` : 'Nada pendiente, qué paz'}</small></div>
      <div class="ledger"><span>${icon('piggy')}Ahorré este mes</span><b class="num">${money0(s.ahorro)}</b><small>${S.data.savingsGoal ? `Meta ${money0(S.data.savingsGoal)} · llevas ${pct(Math.min(100, s.ahorro / S.data.savingsGoal * 100))}` : `${pct(s.ahorroPct)} de lo que entró`}</small></div>
    </div>
  </section>
  <section class="quickgrid" aria-label="Registrar">${ADD_OPTS.slice(0, 4).map(([act, tt, sub, ic, tone]) => `<button class="addopt" data-act="${act}" style="--tone:var(--${tone})"><span class="blob">${icon(ic)}</span><b>${tt}</b><small>${sub}</small></button>`).join('')}<button class="addopt more" data-act="add"><span class="blob">${icon('more')}</span><b>Otra cosa</b><small>Ahorro, transferencia…</small></button></section>
  <section class="stats g4">

/* ---------- MOVIMIENTOS ---------- */
function viewMovimientos() {
  const f = S.filters; const ym = S.month;
  let list = S.data.transactions.filter(t => f.all ? true : inMonth(t, ym));
  if (f.q) { const q = f.q.toLowerCase(); list = list.filter(t => (t.desc + ' ' + (t.notes || '')).toLowerCase().includes(q)); }
  if (f.type) list = list.filter(t => t.type === f.type);
  if (f.cat) list = list.filter(t => t.categoryId === f.cat);
  if (f.method) list = list.filter(t => t.method === f.method);
  if (f.acc) list = list.filter(t => t.accountId === f.acc || t.targetId === f.acc);
  if (f.from) list = list.filter(t => t.date >= f.from);
  if (f.to) list = list.filter(t => t.date <= f.to);
  list.sort((a, b) => b.date.localeCompare(a.date));
  const tot = { ingreso: 0, gasto: 0 }; list.forEach(t => { if (tot[t.type] != null) tot[t.type] += t.amount; });
  let html = '', lastDay = '';
  list.forEach(t => { if (t.date !== lastDay) { html += `<div class="day-h">${dateLong(t.date)}</div>`; lastDay = t.date; } html += txRow(t); });
  const cats = S.data.categories;
  return `
  <div class="ph"><div><div class="eyebrow">${f.all ? 'Todo el historial' : monthLabel(ym)}</div><h1>Movimientos</h1><p>${list.length} movimiento${list.length === 1 ? '' : 's'} · ingresos <b class="pos num">${money0(tot.ingreso)}</b> · gastos <b class="num">${money0(tot.gasto)}</b></p></div>
    <div class="acts"><button class="btn primary" data-act="new-gasto">${icon('plus')}<span>Registrar gasto</span></button><button class="btn green" data-act="new-ingreso">${icon('plus')}<span>Registrar ingreso</span></button></div></div>
  <div class="card">
    <div class="filters"><input class="inp search" id="f-q" placeholder="Buscar descripción…" value="${esc(f.q || '')}">
      <select class="sel pill" id="f-type"><option value="">Todos los tipos</option>${Object.entries(TYPES).map(([k, v]) => `<option value="${k}"${f.type === k ? ' selected' : ''}>${v}</option>`).join('')}</select>
      <select class="sel pill" id="f-cat"><option value="">Todas las categorías</option>${cats.map(c => `<option value="${c.id}"${f.cat === c.id ? ' selected' : ''}>${esc(c.name)}</option>`).join('')}</select>
      <select class="sel pill" id="f-method"><option value="">Método</option>${Object.entries(METHODS).map(([k, v]) => `<option value="${k}"${f.method === k ? ' selected' : ''}>${v}</option>`).join('')}</select>
      <select class="sel pill" id="f-acc"><option value="">Cuenta / tarjeta</option>${allAccounts().map(a => `<option value="${a.id}"${f.acc === a.id ? ' selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
      <input class="inp date" type="date" id="f-from" value="${f.from || ''}" title="Desde"><input class="inp date" type="date" id="f-to" value="${f.to || ''}" title="Hasta">
      <label class="chip${f.all ? ' on' : ''}" id="f-all">${f.all ? 'Todos los meses' : 'Solo este mes'}</label>
      ${(f.q || f.type || f.cat || f.method || f.acc || f.from || f.to || f.all) ? '<button class="btn quiet sm" id="f-clear">Limpiar</button>' : ''}</div>
    <div class="list">${html || '<div class="empty"><h3>Sin movimientos</h3><p>Cambia los filtros o registra uno nuevo.</p></div>'}</div>
  </div>`;
}
function bindMovimientos(root) {
  const set = (k, v) => { S.filters[k] = v; render(); };
  const q = root.querySelector('#f-q'); if (q) { q.addEventListener('input', e => { S.filters.q = e.target.value; clearTimeout(q._t); q._t = setTimeout(() => { const pos = q.selectionStart; render(); const nq = document.querySelector('#f-q'); if (nq) { nq.focus(); nq.setSelectionRange(pos, pos); } }, 250); }); }
  ['type', 'cat', 'method', 'acc', 'from', 'to'].forEach(k => { const el = root.querySelector('#f-' + k); if (el) el.addEventListener('change', e => set(k, e.target.value)); });
  const all = root.querySelector('#f-all'); if (all) all.addEventListener('click', () => set('all', !S.filters.all));
  const clr = root.querySelector('#f-clear'); if (clr) clr.addEventListener('click', () => { S.filters = {}; render(); });
}

/* ---------- ¿EN QUÉ SE FUE? ---------- */
function viewGastos() {
  const ym = S.month; const s = monthSummary(ym); const rank = categoryRanking(ym); const prevYm = addMonths(ym, -1);
  const top = rank.slice(0, 6); const rest = rank.slice(6);
  const items = top.map(r => ({ label: r.cat.name, value: r.v, color: col(r.cat.color), key: r.cat.id })); if (rest.length) items.push({ label: 'Otras', value: sum(rest, r => r.v), color: col(OTHERS_COLOR), key: 'rest' });
  const byMethod = {}; S.data.transactions.filter(t => inMonth(t, ym) && t.type === 'gasto').forEach(t => { byMethod[t.method] = (byMethod[t.method] || 0) + t.amount; }); if (s.instMonthly) byMethod.credito = (byMethod.credito || 0) + s.instMonthly;
  const mtot = Object.values(byMethod).reduce((a, b) => a + b, 0);
  const max = rank.length ? rank[0].v : 1;
  return `
  <div class="ph"><div><div class="eyebrow">${monthLabel(ym)}</div><h1>¿En qué se fue mi dinero?</h1><p>Gastaste <b class="num">${money0(s.gastosTotal)}</b>${s.gastosTotal ? ` · ${pct(s.fijos / s.gastosTotal * 100)} fijo y ${pct(s.variables / s.gastosTotal * 100)} variable` : ''}.</p></div></div>
  ${s.gastosTotal ? `
  <section class="g23">
    <div class="card"><div class="ch"><h2>Distribución por categoría</h2></div><div class="donutwrap">${donutSVG(items, 'gastado', money0(s.gastosTotal))}<div class="legend">${items.map(i => `<div class="l" data-key="${i.key}" style="--cat:${i.color}"><i></i><span>${esc(i.label)}</span><b>${money0(i.value)}</b><em>${pct(i.value / s.gastosTotal * 100)}</em></div>`).join('')}</div></div></div>
    <div class="card"><div class="ch"><h2>Por tipo de compra</h2></div>
      <div class="flow"><div class="fb">${Object.entries(byMethod).map(([k, v]) => `<i style="--c:${k === 'credito' ? 'var(--plum)' : k === 'efectivo' ? 'var(--amber)' : 'var(--green)'};width:${v / mtot * 100}%" data-tip="<b>${METHODS[k]}</b>${money0(v)}"></i>`).join('')}</div>
      <div class="fl">${Object.entries(byMethod).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div style="--c:${k === 'credito' ? 'var(--plum)' : k === 'efectivo' ? 'var(--amber)' : 'var(--green)'}"><b class="num">${money0(v)}</b><span>${METHODS[k]} · ${pct(v / mtot * 100)}</span></div>`).join('')}</div></div>
      <div class="flow" style="margin-top:6px"><div class="fb"><i style="--c:var(--ink-3);width:${s.fijos / s.gastosTotal * 100}%" data-tip="<b>Fijos</b>${money0(s.fijos)}"></i><i style="--c:var(--plum-line);width:${s.variables / s.gastosTotal * 100}%" data-tip="<b>Variables</b>${money0(s.variables)}"></i></div>
      <div class="fl"><div style="--c:var(--ink-3)"><b class="num">${money0(s.fijos)}</b><span>Gastos fijos</span></div><div style="--c:var(--plum-line)"><b class="num">${money0(s.variables)}</b><span>Gastos variables</span></div></div></div>
      <p class="mut" style="font-size:12.5px">Las compras a crédito cuentan como gasto cuando se hacen. El pago de la tarjeta después no se vuelve a contar.</p>
    </div>
  </section>
  <section class="g2">
    <div class="card"><div class="ch"><h2>Ranking de categorías</h2></div><div class="rank">${rank.map(r => `<div class="r" style="--cat:${col(r.cat.color)}"><div class="nm"><i></i><span>${esc(r.cat.name)}</span></div><div></div><div class="v num">${money0(r.v)}<small>${pct(r.share)}</small></div><div class="bar"><i style="width:${r.v / max * 100}%"></i></div></div>`).join('')}</div></div>
    <div class="card"><div class="ch"><h2>Comparado con ${monthLabel(prevYm)}</h2></div><div class="list">${rank.map(r => `<div class="row">${catIcon(r.cat)}<div class="tx"><b>${esc(r.cat.name)}</b><span>Antes ${money0(r.prev)} · ahora ${money0(r.v)}</span></div><div class="am">${deltaTag(r.delta)}</div></div>`).join('')}
      ${Object.entries(monthSummary(prevYm).byCat).filter(([id]) => !s.byCat[id]).map(([id, v]) => `<div class="row">${catIcon(cat(id))}<div class="tx"><b>${esc(cat(id).name)}</b><span>Antes ${money0(v)} · ahora $0</span></div><div class="am"><span class="delta down">−100%</span></div></div>`).join('')}</div></div>
  </section>` : '<div class="card"><div class="empty"><h3>Sin gastos en este mes</h3><p>Registra gastos y aquí verás a dónde se va tu dinero.</p><button class="btn primary sm" data-act="new-gasto">Registrar gasto</button></div></div>'}`;
}

/* ---------- TARJETAS ---------- */
function ccCard(c, ym) {
  const m = cardMonth(c, ym); const tone = m.util > 70 ? 'b' : m.util > 40 ? 'w' : 'g';
  return `<div class="cc" data-card="${c.id}"><div class="hd"><div><div class="nm">${esc(c.name)}</div><div class="inst">${esc(c.institution || '')}${c.rate ? ` · ${c.rate}% anual` : ''}</div></div><div class="chipx" style="--cc:${col(c.color || '#9B2B5A')}"></div></div>
    <div><div class="eyebrow">Saldo actual</div><div class="used num">${money0(m.bal)}<small>de ${money0(c.limit)}</small></div></div>
    <div class="pct"><div class="bar ${tone}"><i style="width:${Math.min(100, m.util)}%"></i></div><span class="num">${pct(m.util)}</span></div>
    <div class="kv"><div><span>Disponible</span><b class="pos">${money0(m.available)}</b></div><div><span>Corte</span><b>día ${c.cutDay}</b></div><div><span>Pago mínimo</span><b>${money0(m.minPay)}</b></div><div><span>Para no generar intereses</span><b>${money0(m.noInterest)}</b></div></div>
    <div class="pay"><div><div class="eyebrow">Próximo pago · ${dateLabel(m.payDate)}</div><b class="num">${money0(Math.max(0, Math.min(m.noInterest, m.prev) - m.paid))}</b>${m.paid ? ` <span class="mut">· pagado ${money0(m.paid)}</span>` : ''}</div>${statusTag(m.status)}</div></div>`;
}
function viewTarjetas() {
  const ym = S.month; const s = monthSummary(ym);
  const inst = S.data.installments.map(i => ({ i, info: installmentInfo(i, ym) })).sort((a, b) => a.info.remaining - b.info.remaining);
  return `
  <div class="ph"><div><div class="eyebrow">${monthLabel(ym)}</div><h1>Tarjetas de crédito</h1><p>Debes <b class="num neg">${money0(s.tarjetasTotal)}</b> en ${S.data.cards.length} tarjeta${S.data.cards.length === 1 ? '' : 's'} · crédito disponible <b class="num">${money0(sum(s.cards, x => x.m.available))}</b></p></div>
    <div class="acts"><button class="btn secondary" data-act="new-pago-tarjeta">${icon('check')}<span>Registrar pago</span></button><button class="btn secondary" data-act="new-meses">${icon('layers')}<span>Compra a meses</span></button><button class="btn primary" data-act="new-tarjeta">${icon('plus')}<span>Agregar tarjeta</span></button></div></div>
  <section class="g2">${S.data.cards.length ? S.data.cards.map(c => ccCard(c, ym)).join('') : '<div class="card" style="grid-column:1/-1"><div class="empty"><h3>Sin tarjetas</h3><p>Agrega tu primera tarjeta para ver utilización, cortes y pagos.</p><button class="btn primary sm" data-act="new-tarjeta">Agregar tarjeta</button></div></div>'}</section>
  <section class="card"><div class="ch"><h2>Compras a meses</h2><span class="mut" style="font-size:13px">Este mes: <b class="num">${money0(s.instMonthly)}</b> en mensualidades</span></div>
    ${inst.length ? `<div class="g3">${inst.map(({ i, info }) => `<div class="debt" data-ins="${i.id}"><div class="hd"><div><b>${esc(i.desc)}</b><span>${accountName(i.cardId)} · ${i.months} meses</span></div>${info.remaining === 0 ? '<span class="tag good">Liquidada</span>' : info.future ? '<span class="tag">Inicia ' + monthShort(i.start) + '</span>' : `<span class="tag plum">${info.remaining} restante${info.remaining === 1 ? '' : 's'}</span>`}</div>
      <div class="big num">${money0(info.monthly)}<small>/ mes</small></div>
      <div class="bar thick"><i style="width:${info.paidCount / i.months * 100}%"></i></div>
      <div class="pr"><span>${info.paidCount} de ${i.months} pagos</span><span>Pendiente <b>${money0(info.pending)}</b></span></div>
      <div class="kv"><div><span>Total</span><b>${money0(i.total)}</b></div><div><span>Inicio</span><b>${monthShort(i.start)}</b></div><div><span>Termina</span><b>${monthShort(info.end)}</b></div></div></div>`).join('')}</div>` : '<div class="empty"><h3>Sin compras a meses</h3><p>Registra compras diferidas y verás cuánto falta por pagar.</p></div>'}
  </section>`;
}

/* ---------- DEUDAS ---------- */

    <div class="acts"><button class="btn secondary" data-act="new-pago-deuda">${icon('check')}<span>Registrar pago</span></button><button class="btn primary" data-act="new-deuda">${icon('plus')}<span>Agregar deuda</span></button></div></div>

    <div class="big num">${money0(i.pending)}<small>pendientes</small></div>
    <div class="bar thick ${i.done ? 'g' : ''}"><i style="width:${Math.min(100, i.progress)}%"></i></div>

/* ---------- RECURRENTES ---------- */
function viewRecurrentes() {
  const list = S.data.recurring.slice().sort((a, b) => a.day - b.day);
  const monthly = sum(list.filter(r => r.active), r => r.freq === 'quincenal' ? r.amount * 2 : r.freq === 'semanal' ? r.amount * 4 : r.freq === 'bimestral' ? r.amount / 2 : r.freq === 'anual' ? r.amount / 12 : r.amount);
  return `
  <div class="ph"><div><div class="eyebrow">Cada mes</div><h1>Gastos recurrentes</h1><p>Equivalen a <b class="num">${money0(monthly)}</b> al mes. Se agregan solos al mes correspondiente.</p></div>
    <div class="acts"><button class="btn primary" data-act="new-rec">${icon('plus')}<span>Agregar recurrente</span></button></div></div>
  <section class="card"><div class="list">${list.length ? list.map(r => { const c = cat(r.categoryId); return `<div class="row click" data-rec="${r.id}" style="${r.active ? '' : 'opacity:.5'}">${catIcon(c)}<div class="tx"><b>${esc(r.name)} ${r.active ? '' : '<span class="tag">Pausado</span>'}</b><span>${FREQ[r.freq]} · día ${r.day} · ${c.name} · ${METHODS[r.method]} · ${accountName(r.accountId)}</span></div><div class="am">${money(r.amount)}<small>${FREQ[r.freq].toLowerCase()}</small></div></div>`; }).join('') : '<div class="empty"><h3>Sin recurrentes</h3><p>Renta, internet, suscripciones, gimnasio…</p></div>'}</div></section>`;
}

/* ---------- PRESUPUESTO ---------- */
function viewPresupuesto() {
  const ym = S.month; const bs = budgetStatus(ym); const s = monthSummary(ym);
  const totalB = sum(bs, b => b.budget), totalS = sum(bs, b => b.spent);
  const without = S.data.categories.filter(c => c.kind === 'gasto' && !S.data.budgets[c.id]);
  return `
  <div class="ph"><div><div class="eyebrow">${monthLabel(ym)}</div><h1>Presupuesto mensual</h1><p>Presupuestado <b class="num">${money0(totalB)}</b> · gastado <b class="num">${money0(totalS)}</b> · ${bs.filter(b => b.over).length ? `<b class="neg">${bs.filter(b => b.over).length} categoría${bs.filter(b => b.over).length === 1 ? '' : 's'} excedida${bs.filter(b => b.over).length === 1 ? '' : 's'}</b>` : 'todo en orden'}</p></div>

</script>
  <script>
/* ===== Raw Money · ¿Y si…? simulador de compras y gastos =====
   Parte de tus promedios reales (últimos 3 meses cerrados) y te deja mover cada gasto.
   Las filas con candado no se tocan; el recorte sugerido sale de las filas libres, en proporción a lo que pesan.
   El escenario se guarda en S.data.whatif (también en la nube si hay sesión). */

/* Meses base: los últimos 3 meses con datos antes del actual; si no hay, el mes actual */
function whatifBaseMonths() {
  const past = monthsWithData().filter(m => m < thisMonth());
  return past.length ? past.slice(-3) : [thisMonth()];
}
/* Escenario inicial a partir de lo que realmente pasó */
function whatifFromReal() {
  const months = whatifBaseMonths(); const n = months.length; const sums = months.map(monthSummary);
  const avg = f => sums.reduce((a, s) => a + f(s), 0) / n;
  const rows = [];
  const catTotals = {}; sums.forEach(s => Object.entries(s.byCat).forEach(([id, v]) => { catTotals[id] = (catTotals[id] || 0) + v; }));
  Object.entries(catTotals).sort((a, b) => b[1] - a[1]).forEach(([id, tot]) => {
    const tx = S.data.transactions.filter(t => t.type === 'gasto' && (t.categoryId || 'otros') === id && months.includes(t.date.slice(0, 7)));
    const fixedShare = tx.length ? sum(tx.filter(t => t.fixed)) / Math.max(1, sum(tx)) : 0;
    rows.push({ id: 'cat:' + id, name: cat(id).name, cat: id, amount: Math.round(tot / n), locked: fixedShare >= .5 });
  });
  const debtsMonthly = sum(S.data.debts.filter(d => !debtInfo(d, thisMonth()).done), d => d.monthly);
  if (debtsMonthly) rows.push({ id: 'deudas', name: 'Pagos de deudas', amount: Math.round(debtsMonthly), locked: true });
  const ahorro = S.data.savingsGoal || Math.round(avg(s => s.ahorro));
  rows.push({ id: 'ahorro', name: 'Ahorro', amount: ahorro, locked: true });
  return { income: Math.round(avg(s => s.ingresos)), rows, item: { name: '', price: 0, months: 6 }, base: months };
}
function whatifState() {
  if (!S.data.whatif || !Array.isArray(S.data.whatif.rows)) S.data.whatif = whatifFromReal();
  return S.data.whatif;
}
let whatifSaveT;
function whatifSave() { clearTimeout(whatifSaveT); whatifSaveT = setTimeout(saveData, 600); }

/* El cálculo: cuánto sobra, cuánto pide la compra y de dónde sale lo que falta */
function whatifCalc(W) {
  const total = sum(W.rows, r => r.amount);
  const sobra = W.income - total;
  const price = Number(W.item.price) || 0; const months = Math.max(1, Number(W.item.months) || 1);
  const monthly = price / months;
  const free = W.rows.filter(r => !r.locked && r.amount > 0); const freeTotal = sum(free, r => r.amount);
  const need = Math.max(0, monthly - sobra);
  const feasible = need <= freeTotal + .5;
  const cuts = {}; if (need > 0 && freeTotal > 0) free.forEach(r => { cuts[r.id] = Math.min(r.amount, need * r.amount / freeTotal); });
  const room = sobra + freeTotal; // lo máximo que podrías liberar al mes recortando todo lo libre
  const minMonths = price && room > 0 ? Math.ceil(price / room) : null;
  const monthsNoCut = price && sobra > 0 ? Math.ceil(price / sobra) : null;
  return { total, sobra, price, months, monthly, need, feasible, cuts, freeTotal, minMonths, monthsNoCut, after: sobra - monthly + (feasible ? need : freeTotal) };
}

/* Cuenta animada de un número a otro (easeOutCubic) */
function countTo(el, from, to, ms = 520, fmt = money0, isInput = false) {
  const put = v => { if (isInput) el.value = Math.round(v); else el.textContent = fmt(v); };
  cancelAnimationFrame(el._raf);
  if (from === to || reduceMotion()) { put(to); return; }
  if (!isInput) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  const t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); put(from + (to - from) * e); if (k < 1) el._raf = requestAnimationFrame(step); };
  el._raf = requestAnimationFrame(step);
}

      head = c.need === 0 ? 'Sí te alcanza' : c.feasible ? 'Te alcanza si recortas' : 'Así no te alcanza';

      if (c.sobra < 0) note = `Ojo: antes de la compra ya gastas ${money0(-c.sobra)} más de lo que entra, por eso el recorte es mayor que la compra. `;
      if (c.need > 0 && c.feasible && top.length) note += `Lo que más baja: ${top.join(' y ')}. El detalle está en la columna <b>Sugerido</b>.`;
      else if (!c.feasible) note += c.minMonths ? `Prueba con <b>${mes(c.minMonths)} o más</b>, o suelta algún candado.` : 'Suelta algún candado o sube lo que entra.';

    const vEl = $('#wf-verdict'); const changedHead = vEl.dataset.head !== head; vEl.dataset.head = head;
    vEl.innerHTML = `<div class="eyebrow${changedHead ? ' wf-swap' : ''}"><i>${icon(headIc)}</i>${head}</div><div class="wf-stats">${stats}</div>${note ? `<p>${note}</p>` : ''}`;
    vEl.querySelectorAll('b[data-v]').forEach(b => { const k = b.parentElement.dataset.k, to = Number(b.dataset.v), from = prevV[k] ?? to; prevV[k] = to; countTo(b, from, to); });
    // sugeridos
    W.rows.forEach(r => { const td = root.querySelector(`[data-sug="${r.id}"]`); if (!td) return; const cut = c.cuts[r.id]; const key = String(Math.round(cut || 0)); if (td.dataset.k !== undefined && td.dataset.k !== key) flash(td); td.dataset.k = key; td.innerHTML = cut ? `<b>${money0(r.amount - cut)}</b><small class="neg">−${money0(cut)}</small>` : `<span class="mut">${money0(r.amount)}</span>`; });
    $('#wf-total').textContent = money0(c.total);
    const cutTot = Object.values(c.cuts).reduce((a, b) => a + b, 0);
    $('#wf-total-sug').innerHTML = cutTot ? `<b>${money0(c.total - cutTot)}</b>` : money0(c.total);
    $('#wf-apply').hidden = !cutTot;
    // barra: fijo · libre · compra · sobra, sobre lo que entra
    const inc = Math.max(1, W.income, c.total + c.monthly);
    const fixed = sum(W.rows.filter(r => r.locked), r => r.amount), freeV = c.total - fixed;
    const parts = [['Fijo', fixed, '#9A6A94'], ['Libre', freeV - cutTot, '#DCC0D8'], [W.item.name || 'Compra', c.monthly, '#F2A7C3'], ['Te queda', Math.max(0, W.income - (c.total - cutTot) - c.monthly), '#C9CF6A']];
    const segs = root.querySelectorAll('#wf-bar [data-seg]');
    parts.forEach(([l, v, cc], k) => { const el = segs[k]; el.style.setProperty('--c', cc); el.style.width = `${Math.max(0, v) / inc * 100}%`; el.dataset.tip = `<b>${esc(l)}</b>${money0(v)}`; el.classList.toggle('off', !(v > 0)); });
    $('#wf-bar .leg2').innerHTML = parts.filter(p => p[1] > 0).map(([l, v, cc]) => `<span><i class="sq" style="--c:${cc}"></i>${esc(l)} ${money0(v)}</span>`).join('');
    bindTips($('#wf-bar'));
  };
  const setAmt = (id, v, from) => { const r = row(id); if (!r) return; r.amount = Math.max(0, Math.round(Number(v) || 0)); const rg = root.querySelector(`[data-range="${id}"]`), nm = root.querySelector(`[data-num="${id}"]`); if (from !== 'range') { if (r.amount > Number(rg.max)) rg.max = sliderMax(r.amount); rg.value = r.amount; } if (from !== 'num') nm.value = r.amount; whatifSave(); paint(); };
  root.querySelectorAll('[data-range]').forEach(el => el.addEventListener('input', () => setAmt(el.dataset.range, el.value, 'range')));
  root.querySelectorAll('[data-num]').forEach(el => el.addEventListener('input', () => setAmt(el.dataset.num, el.value, 'num')));
  root.querySelectorAll('[data-lock]').forEach(b => b.addEventListener('click', () => { const r = row(b.dataset.lock); r.locked = !r.locked; whatifSave(); S._keepScroll = true; render(); }));
  root.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => { W.rows = W.rows.filter(r => r.id !== b.dataset.del); whatifSave(); S._keepScroll = true; render(); }));
  // compra
  $('#wf-item').addEventListener('input', e => { W.item.name = e.target.value; whatifSave(); paint(); });
  $('#wf-price').addEventListener('input', e => { W.item.price = Math.max(0, Number(e.target.value) || 0); whatifSave(); paint(); });
  $('#wf-months').addEventListener('input', e => { W.item.months = Number(e.target.value); $('#wf-months-l').textContent = W.item.months; whatifSave(); paint(); });

  $('#wf-apply').addEventListener('click', () => { const c = whatifCalc(W); W.rows.forEach(r => { if (c.cuts[r.id]) r.amount = Math.round(r.amount - c.cuts[r.id]); }); whatifSave(); S._keepScroll = true; render(); toast('Recorte aplicado a la tabla'); });

  $('#wf-budget').addEventListener('click', () => confirmBox('¿Usar la tabla como presupuesto?', 'Cada categoría de la tabla queda con su monto como presupuesto mensual. Las filas de deudas, ahorro y las que agregaste a mano no cambian nada.', () => { W.rows.filter(r => r.cat).forEach(r => { if (r.amount > 0) S.data.budgets[r.cat] = r.amount; else delete S.data.budgets[r.cat]; }); saveData(); toast('Presupuesto actualizado'); }, 'Usar'));
  $('#wf-frombudget').addEventListener('click', () => {
    const bud = Object.entries(S.data.budgets || {}).filter(([, v]) => Number(v) > 0);
    if (!bud.length) { toast('Todavía no tienes presupuesto. Ármalo en Presupuesto o aquí con «Usar la tabla como presupuesto».'); return; }
    confirmBox('¿Tomar tu presupuesto como ejemplo?', `Las ${bud.length} categorías con presupuesto toman ese monto${S.data.savingsGoal ? ' y el ahorro toma tu meta' : ''}. Las demás filas se quedan como están. Tus movimientos no cambian.`, () => {
      bud.forEach(([id, v]) => { const r = row('cat:' + id); if (r) r.amount = Math.round(v); else W.rows.splice(W.rows.findIndex(x => !x.cat) < 0 ? W.rows.length : W.rows.findIndex(x => !x.cat), 0, { id: 'cat:' + id, name: cat(id).name, cat: id, amount: Math.round(v), locked: false }); });

  paint();

    const tr = root.querySelector(`[data-row="${whatifJustAdded}"]`); const r = row(whatifJustAdded); whatifJustAdded = null;

}

function closeDrawer() { document.querySelectorAll('.veil,.drawer,.sheet').forEach(e => e.remove()); document.removeEventListener('keydown', escClose); }
function escClose(e) { if (e.key === 'Escape') closeDrawer(); }
function openDrawer({ title, eyebrow, body, onSave, onDelete, saveLabel = 'Guardar', deleteLabel = 'Eliminar' }) {
  closeDrawer();
  const veil = document.createElement('div'); veil.className = 'veil'; veil.addEventListener('click', closeDrawer);
  const dr = document.createElement('aside'); dr.className = 'drawer'; dr.setAttribute('role', 'dialog'); dr.setAttribute('aria-label', title);

  document.body.append(veil, dr);
  dr.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeDrawer));
  const form = dr.querySelector('form');

  if (onSave) dr.querySelector('[data-save]').addEventListener('click', () => onSave(readForm(form), form));

  });

}

/* Opción para crear un concepto nuevo sin salir del formulario */
const NEW_CAT = '__new';
const catOptsNew = kind => [...catOpts(kind), [NEW_CAT, '+ Nueva categoría…']];
const newCatBox = () => `<div class="newcat" hidden><div class="f"><label for="fx-newcat">Nueva categoría</label><input class="inp" id="fx-newcat" placeholder="Ej. Café, Regalos, Clases…" maxlength="40" autocomplete="off"></div><div class="swatches sm">${CAT_COLORS.slice(0, 12).map(c => `<button type="button" class="sw" data-c="${c}" style="--c:${c}" aria-label="Color"></button>`).join('')}</div><div class="newcat-acts"><button type="button" class="btn quiet sm" data-nc="cancel">Cancelar</button><button type="button" class="btn primary sm" data-nc="ok">${icon('plus')}Crear y usar</button></div></div>`;
function bindNewCat(form, kindOf) {
  const sel = form.querySelector('[name=categoryId]'); const box = form.querySelector('.newcat'); const inp = box.querySelector('#fx-newcat');
  let prev = sel.value, color = null;
  const pickColor = c => { color = c; box.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.c === c)); };
  const close = () => { box.hidden = true; inp.value = ''; };
  sel.addEventListener('focus', () => { if (sel.value !== NEW_CAT) prev = sel.value; });
  sel.addEventListener('change', () => {
    if (sel.value !== NEW_CAT) { prev = sel.value; return; }
    sel.value = prev; box.hidden = false;
    const used = new Set(S.data.categories.map(c => c.color)); pickColor(CAT_COLORS.find(c => !used.has(c)) || CAT_COLORS[S.data.categories.length % 12]);
    inp.focus();
  });
  box.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => pickColor(b.dataset.c)));
  const create = () => {
    const name = inp.value.trim(); if (!name) { toast('Escribe el nombre de la categoría'); inp.focus(); return; }
    const kind = kindOf();
    let c = S.data.categories.find(x => x.kind === kind && x.name.toLowerCase() === name.toLowerCase());
    if (!c) { c = { id: uid(), name, icon: kind === 'ingreso' ? 'wallet' : 'dots', color, kind }; S.data.categories.push(c); saveData(); toast(`Categoría “${name}” creada`); }
    else toast(`“${c.name}” ya existía, la elegí`);
    sel.innerHTML = catOptsNew(kind).map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join(''); sel.value = c.id; prev = c.id; close();
  };
  box.querySelector('[data-nc=ok]').addEventListener('click', create);
  box.querySelector('[data-nc=cancel]').addEventListener('click', () => { close(); sel.focus(); });
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); create(); } if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); sel.focus(); } });
  return close;
}
function need(form, ok, msg) { if (!ok) { toast(msg); return false; } return true; }

/* ---------- Movimiento ---------- */
function formTx(t, preset = {}) {
  const isNew = !t; const v = { type: 'gasto', date: todayISO(), method: 'debito', accountId: (S.data.accounts[0] || {}).id, categoryId: 'alimentacion', fixed: false, ...preset, ...(t || {}) };
  const body = `
    ${F.seg('type', Object.entries(TYPES), v.type)}
    ${F.amount('amount', v.amount)}
    <div class="fr">${F.date('date', 'Fecha', v.date)}${F.text('desc', 'Descripción', v.desc, 'Ej. Súper, Gasolina…', 'required')}</div>
    ${F.sel('categoryId', 'Categoría', catOptsNew(v.type === 'ingreso' ? 'ingreso' : 'gasto'), v.categoryId)}
    ${newCatBox()}
    ${F.sel('method', 'Método de pago', Object.entries(METHODS), v.method)}
    ${F.sel('accountId', 'Cuenta o tarjeta', allAccOpts(), v.accountId, 'Si usas tarjeta de crédito, elige la tarjeta y el método “Crédito”.')}
    ${F.sel('targetId', 'Destino', [], v.targetId)}
    ${F.toggle('fixed', 'Es un gasto fijo (renta, servicios, mensualidades…)', v.fixed)}
    ${F.area('notes', 'Notas (opcional)', v.notes)}`;
  const dr = openDrawer({ title: isNew ? ({ gasto: '¿Qué gastaste?', ingreso: '¿Cuánto entró?', pago_tarjeta: 'Pago de tarjeta', pago_deuda: 'Abono a una deuda', ahorro: '¿Cuánto apartaste?', transferencia: 'Mover entre cuentas' }[v.type] || 'Nuevo movimiento') : 'Editar movimiento', eyebrow: isNew ? 'Registrar' : dateLong(v.date), body, saveLabel: isNew ? 'Registrar' : 'Guardar cambios',
    onSave: (o, form) => {
      if (!need(form, o.amount > 0, 'Escribe un monto mayor a cero')) return; if (!need(form, o.desc, 'Escribe una descripción')) return;
      const isCard = !!byId(S.data.cards, o.accountId);
      if (o.type === 'gasto' && isCard) o.method = 'credito';
      if (o.type === 'gasto' && o.method === 'credito' && !isCard) { if (!need(form, false, 'Para pagar con crédito elige una tarjeta')) return; }
      if (o.type !== 'gasto' && isCard) { if (!need(form, false, 'Elige una cuenta de débito o efectivo')) return; }
      if (['transferencia', 'pago_tarjeta', 'pago_deuda'].includes(o.type) && !o.targetId) { if (!need(form, false, 'Elige el destino')) return; }
      if (!['gasto', 'ingreso'].includes(o.type)) o.categoryId = null;
      if (o.type !== 'gasto') o.fixed = false;
      if (!['transferencia', 'pago_tarjeta', 'pago_deuda'].includes(o.type)) o.targetId = null;
      if (o.type === 'ingreso' && o.method === 'credito') o.method = 'transferencia';
      if (isNew) { S.data.transactions.push({ id: uid(), ...o }); toast(o.type === 'ingreso' ? 'Ingreso registrado' : 'Movimiento registrado'); dispatchEvent(new CustomEvent('rm:tx', { detail: o })); }
      else { Object.assign(t, o); toast('Cambios guardados'); }
      saveData(); closeDrawer(); render();
    },
    onDelete: isNew ? null : () => confirmBox('¿Eliminar este movimiento?', t.recurringId ? 'Es un gasto recurrente: solo se quitará de este mes.' : 'Esta acción no se puede deshacer.', () => { if (t.recurringId) S.data.skips.push(t.id); S.data.transactions = S.data.transactions.filter(x => x.id !== t.id); saveData(); closeDrawer(); render(); toast('Movimiento eliminado'); }) });
  const form = dr.querySelector('form');
  const closeNewCat = bindNewCat(form, () => form.querySelector('[name=type]:checked').value === 'ingreso' ? 'ingreso' : 'gasto');
  const sync = () => {
    const type = form.querySelector('[name=type]:checked').value; const method = form.querySelector('[name=method]');
    const show = (n, on) => { const el = form.querySelector(`[data-f="${n}"]`); if (el) el.hidden = !on; };
    show('categoryId', type === 'gasto' || type === 'ingreso'); if (!(type === 'gasto' || type === 'ingreso')) closeNewCat(); show('method', type === 'gasto');
    show('targetId', ['transferencia', 'pago_tarjeta', 'pago_deuda'].includes(type));
    form.querySelector('.toggle').hidden = type !== 'gasto';
    form.querySelector('label[for=fx-accountId]').textContent = type === 'transferencia' ? 'Desde la cuenta' : type === 'gasto' ? 'Cuenta o tarjeta' : type === 'ingreso' ? 'Cuenta donde entra' : 'Cuenta desde la que pagas';
    // categorías por tipo
    const cs = form.querySelector('[name=categoryId]'); const kind = type === 'ingreso' ? 'ingreso' : 'gasto';
    if (cs.dataset.kind !== kind) { const cur = cs.value; closeNewCat(); cs.innerHTML = catOptsNew(kind).map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join(''); cs.dataset.kind = kind; if ([...cs.options].some(o => o.value === cur)) cs.value = cur; else if (kind === 'ingreso') cs.value = 'sueldo'; }
    // cuentas: sólo débito/efectivo salvo gasto
    const as = form.querySelector('[name=accountId]'); const cur = as.value; const opts = type === 'gasto' ? allAccOpts() : accOpts();
    as.innerHTML = opts.map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join(''); if (opts.some(o => o[0] === cur)) as.value = cur;
    // destino
    const ts = form.querySelector('[name=targetId]'); const tcur = ts.value;
    const topts = type === 'transferencia' ? accOpts().filter(o => o[0] !== as.value) : type === 'pago_tarjeta' ? cardOpts() : type === 'pago_deuda' ? S.data.debts.map(d => [d.id, d.name]) : [];
    ts.innerHTML = topts.map(([k, n]) => `<option value="${k}">${esc(n)}</option>`).join(''); if (topts.some(o => o[0] === tcur)) ts.value = tcur;
    form.querySelector('label[for=fx-targetId]').textContent = type === 'transferencia' ? 'A la cuenta' : type === 'pago_tarjeta' ? 'Tarjeta que pagas' : 'Deuda que pagas';
    if (type === 'gasto') { const isCard = !!byId(S.data.cards, as.value); if (isCard) method.value = 'credito'; else if (method.value === 'credito') method.value = 'debito'; }
  };
  form.addEventListener('change', e => { if (['type', 'accountId', 'method'].includes(e.target.name)) { if (e.target.name === 'method' && e.target.value === 'credito' && !byId(S.data.cards, form.querySelector('[name=accountId]').value) && S.data.cards[0]) form.querySelector('[name=accountId]').value = S.data.cards[0].id; sync(); } });
  sync();
}

<script>
/* ===== Raw Money · sincronización con Supabase (opcional) =====

const CLOUD = { client: null, user: null, ready: false, saving: false, lastError: '', enabled: false };
function cloudEnabled() { return !!(window.SUPABASE && window.SUPABASE.url && window.SUPABASE.anonKey && window.supabase); }

async function initCloud() {
  CLOUD.enabled = cloudEnabled();
  if (!CLOUD.enabled) return;
  CLOUD.client = window.supabase.createClient(window.SUPABASE.url, window.SUPABASE.anonKey);
  const { data: { session } } = await CLOUD.client.auth.getSession();
  CLOUD.user = session ? session.user : null;
  CLOUD.client.auth.onAuthStateChange(async (event, sess) => {
    if (event === 'PASSWORD_RECOVERY') { CLOUD.user = sess ? sess.user : CLOUD.user; formNewPassword(); return; }
    const was = CLOUD.user && CLOUD.user.id; CLOUD.user = sess ? sess.user : null;
    if (CLOUD.user && CLOUD.user.id !== was) { await cloudPull(); S.locked = false; render(); }
    if (!CLOUD.user && was) { S.locked = true; render(); }
  });
  if (CLOUD.user) { await cloudPull(); }
  CLOUD.ready = true;
}

/* Trae la fila del usuario. Si no existe y hay datos locales, los sube. */
async function cloudPull() {
  if (!CLOUD.client || !CLOUD.user) return;
  const { data, error } = await CLOUD.client.from('finanzas_state').select('data, updated_at').eq('user_id', CLOUD.user.id).maybeSingle();
  if (error) { CLOUD.lastError = error.message; return; }
  if (S.data.demo) { S.data = emptyData(); try { localStorage.setItem(DB_KEY, JSON.stringify(S.data)); } catch (e) {} }
  if (data && data.data && data.data.version === 1) {
    if (data.data.demo) { // si alguna vez se subió la demo, se limpia la nube
      S.data = emptyData(); try { localStorage.setItem(DB_KEY, JSON.stringify(S.data)); } catch (e) {} await cloudPush(); return;
    }
    const remoteTx = (data.data.transactions || []).length; const localTx = (S.data.transactions || []).length;
    // La nube manda, salvo que la nube esté vacía y aquí haya datos reales.
    if (remoteTx > 0 || localTx === 0) { S.data = { ...emptyData(), ...data.data }; try { localStorage.setItem(DB_KEY, JSON.stringify(S.data)); } catch (e) {} }
    else await cloudPush();
  } else if (S.data.transactions.length || S.data.cards.length || S.data.accounts.length) {
    await cloudPush();
  }
}

let cloudT;
function cloudSave() { if (!CLOUD.client || !CLOUD.user) return; clearTimeout(cloudT); cloudT = setTimeout(cloudPush, 900); }
async function cloudPush() {
  if (!CLOUD.client || !CLOUD.user) return;
  if (S.data.demo) { toast('Los datos demo no se guardan en la nube'); return; }

  const { error } = await CLOUD.client.from('finanzas_state').upsert({ user_id: CLOUD.user.id, data: S.data, updated_at: new Date().toISOString() });

async function cloudSignIn(email) {

  const { error } = await CLOUD.client.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
  if (error) toast(error.message); else toast('Te enviamos un enlace a tu correo');
}
async function cloudSignInPassword(email, password) {
  if (!CLOUD.client) return;
  if (!email || !password) { toast('Escribe correo y contraseña'); return; }
  const { error } = await CLOUD.client.auth.signInWithPassword({ email, password });

}

  const { data, error } = await CLOUD.client.auth.signUp({ email, password, options: { emailRedirectTo: location.origin + location.pathname } });

}
async function cloudReset(email) {
  if (!CLOUD.client) return;
  if (!email) { toast('Escribe tu correo'); return; }
  const { error } = await CLOUD.client.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });

}
function formNewPassword() {
  const dr = openDrawer({ title: 'Nueva contraseña', eyebrow: 'Recuperar acceso', body: `${F.text('pw1', 'Nueva contraseña (mínimo 8 caracteres)', '', '', 'type="password" autocomplete="new-password" required')}${F.text('pw2', 'Repite la contraseña', '', '', 'type="password" autocomplete="new-password" required')}`, saveLabel: 'Guardar contraseña',

}
async function cloudSignOut() { if (!CLOUD.client) return; await CLOUD.client.auth.signOut(); CLOUD.user = null; S.locked = true; render(); }

/* Tarjeta "Nube" para Cuentas y ajustes */
function cloudCardHTML() {
  if (!CLOUD.enabled) return `<div class="card"><div class="ch"><h2>Sesión</h2></div><div class="chips"><button class="btn secondary sm" id="local-pw">Cambiar contraseña</button><button class="btn quiet sm" data-act="lock">Cerrar sesión</button></div></div>`;
  if (CLOUD.user) return `<div class="card"><div class="ch"><h2>Nube</h2><span class="tag good">${esc(CLOUD.user.email)}</span></div>${CLOUD.lastError ? `<p class="neg" style="font-size:13px">${esc(CLOUD.lastError)}</p>` : ''}<div class="chips"><button class="btn secondary sm" id="cloud-pull">Traer de la nube</button><button class="btn secondary sm" id="cloud-push">Subir ahora</button><button class="btn secondary sm" id="cloud-pw">Cambiar contraseña</button><button class="btn quiet sm" id="cloud-out">Cerrar sesión</button></div></div>`;
  return '';
}
function bindCloudCard(root) {
  const lp = root.querySelector('#local-pw'); if (lp) lp.addEventListener('click', formLocalPassword);
  const o = root.querySelector('#cloud-out'); if (o) o.addEventListener('click', cloudSignOut);
  const pwb = root.querySelector('#cloud-pw'); if (pwb) pwb.addEventListener('click', formNewPassword);
  const pl = root.querySelector('#cloud-pull'); if (pl) pl.addEventListener('click', async () => { await cloudPull(); render(); toast('Datos traídos de la nube'); });
  const ps = root.querySelector('#cloud-push'); if (ps) ps.addEventListener('click', async () => { await cloudPush(); toast('Subido'); });

async function sha(str) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
function lockGet() { try { return JSON.parse(localStorage.getItem(LOCK_KEY) || 'null'); } catch (e) { return null; } }
function isUnlocked() { if (typeof CLOUD !== 'undefined' && CLOUD.enabled) return !!CLOUD.user; try { return sessionStorage.getItem(UNLOCK_KEY) === '1'; } catch (e) { return true; } }
function unlockLocal() { try { sessionStorage.setItem(UNLOCK_KEY, '1'); } catch (e) {} S.locked = false; render(); }
function lockApp() { try { sessionStorage.removeItem(UNLOCK_KEY); } catch (e) {} S.locked = true; if (typeof CLOUD !== 'undefined' && CLOUD.user) cloudSignOut(); else render(); }

function coverHTML() {
  const lock = lockGet(); const email = (lock && lock.email) || (window.SUPABASE && window.SUPABASE.email) || '';
  return `<section class="login">
    <div class="login-art" aria-hidden="true"><div class="art-frame"><canvas id="cover-art"></canvas><span class="art-num">/01</span><span class="art-cap">Flores<br>y frutas</span></div></div>
    <div class="login-body">
      <h1 class="logo">raw money</h1>
      <form class="login-form" id="gate" autocomplete="on">
        <input type="email" name="email" value="${esc(email)}" autocomplete="username" hidden>
        <div class="field"><label for="gate-pw">Contraseña</label><input id="gate-pw" name="password" type="password" autocomplete="current-password" required></div>
        <p class="form-error" id="gate-err" aria-live="polite"></p>
        <button class="btn primary" type="submit">Entrar</button>
      </form>
    </div>
  </section>`;
}
function bindCover(root) {
  const cv = root.querySelector('#cover-art'); if (cv) { const draw = () => drawCover(cv, 3); if (document.fonts && document.fonts.load) document.fonts.load('600 10px "IBM Plex Mono"').then(draw, draw); else draw(); }
  const f = root.querySelector('#gate'); const err = root.querySelector('#gate-err'); const show = m => { err.textContent = m; };
  const cloud = typeof CLOUD !== 'undefined' && CLOUD.enabled; const lock = lockGet();
  f.addEventListener('submit', async e => {
    e.preventDefault(); show('');
    const email = f.email.value.trim().toLowerCase(); const pw = f.password.value;
    if (cloud) { const { error } = await CLOUD.client.auth.signInWithPassword({ email, password: pw }); if (error) show(/invalid/i.test(error.message) ? 'Correo o contraseña incorrectos' : error.message); return; }
    if (!lock) { if (pw.length < 6) { show('Contraseña incorrecta'); return; } try { localStorage.setItem(LOCK_KEY, JSON.stringify({ email, hash: await sha(email + '|' + pw) })); } catch (x) {} unlockLocal(); return; }
    if (email === lock.email && await sha(email + '|' + pw) === lock.hash) unlockLocal(); else show('Correo o contraseña incorrectos');
  });
  const first = f.querySelector('#gate-pw'); if (first && innerWidth > 900) first.focus();
}

/* Cambiar contraseña local (candado del navegador) */
function formLocalPassword() {
  const lock = lockGet();
  openDrawer({ title: 'Cambiar contraseña', eyebrow: 'Sesión', body: `${lock ? F.text('cur', 'Contraseña actual', '', '', 'type="password" autocomplete="current-password" required') : ''}${F.text('pw1', 'Nueva contraseña', '', '', 'type="password" autocomplete="new-password" required minlength="6"')}${F.text('pw2', 'Repite la nueva contraseña', '', '', 'type="password" autocomplete="new-password" required')}`, saveLabel: 'Guardar',
    onSave: async (o) => { const email = (lock && lock.email) || (window.SUPABASE && window.SUPABASE.email) || ''; if (lock && await sha(email + '|' + o.cur) !== lock.hash) { toast('La contraseña actual no es correcta'); return; } if (o.pw1.length < 6) { toast('Mínimo 6 caracteres'); return; } if (o.pw1 !== o.pw2) { toast('Las contraseñas no coinciden'); return; } try { localStorage.setItem(LOCK_KEY, JSON.stringify({ email, hash: await sha(email + '|' + o.pw1) })); } catch (x) {} closeDrawer(); toast('Contraseña actualizada'); } });
}

    el.addEventListener('pointerdown', e => {

  function face() { if (Math.abs(targetX - x) > 2) facing = targetX > x ? 'right' : 'left'; }

  app.querySelectorAll('[data-ev]').forEach(r => r.addEventListener('click', () => { const [kind, id] = r.dataset.ev.split(':'); if (kind === 'tarjeta' || kind === 'corte') detailCard(byId(S.data.cards, id)); else if (kind === 'deuda') detailDebt(byId(S.data.debts, id)); else if (kind === 'meses') formInstallment(byId(S.data.installments, id)); else formTx(byId(S.data.transactions, id)); }));
  // leyenda ↔ donut
  app.querySelectorAll('.legend .l').forEach(l => { const key = l.dataset.key; const wrap = l.closest('.donutwrap'); l.addEventListener('mouseenter', () => { wrap.querySelectorAll('.donut path').forEach(p => p.style.opacity = p.dataset.key === key ? 1 : .25); wrap.querySelectorAll('.legend .l').forEach(x => x.classList.toggle('dim', x !== l)); }); l.addEventListener('mouseleave', () => { wrap.querySelectorAll('.donut path').forEach(p => p.style.opacity = 1); wrap.querySelectorAll('.legend .l').forEach(x => x.classList.remove('dim')); }); });
  document.title = `${v.title} · Raw Money`;
  window.scrollTo(0, S._keepScroll ? scrollY : 0); S._keepScroll = false;
}

function route() { const h = location.hash.replace('#', '') || 'inicio'; if (VIEWS[h]) { if (h !== S.view) S.filters = h === 'movimientos' ? S.filters : {}; S.view = h; } else S.view = 'inicio'; closeDrawer(); render(); }
function init() {
  applyTheme();
  const loaded = loadData(); S.data = loaded && !(loaded.demo && !window.START_DEMO) ? loaded : (window.START_DEMO ? demoData() : emptyData()); saveData();
  S.month = thisMonth();
  S.locked = !isUnlocked();
  window.addEventListener('hashchange', route);
  route();
  if (typeof initCloud === 'function') initCloud().then(() => { S.locked = !isUnlocked(); render(); });
}
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
